schema_version: "0.2"

component:
  type: service
  id: goreecloud-glaze-ui
  product_name: GLAZE UI V1.3 — Adaptive Resonance
  repository: GoreeCloud/goreecloud-glaze-ui

lifecycle: stable
version: 1.3.0

supported_platforms:
  - web

api:
  versions:
    - "1.3.0"
  endpoints: []

platform_systems:
  manager:
    result: not-applicable-justified
    version: null
    evidence:
      - GLAZE_UI_V1_3.md
      - CONFORMANCE.md
    notes: GLAZE UI is a presentation and interaction authority, not GoreeCloud Manager's operational or administrative runtime authority. Consuming applications retain their own Manager integration obligations.
  privacy_shield:
    result: not-applicable-justified
    version: null
    evidence:
      - GLAZE_UI_V1_3.md
      - EVIDENCE_PRESENTATION.md
    notes: GLAZE UI defines privacy-respecting presentation behavior but does not authorize data processing, consent, retention, or privacy policy. Consumers integrate Privacy Shield where their data responsibilities apply.
  wardveil_security:
    result: not-applicable-justified
    version: null
    evidence:
      - SECURITY.md
      - STATES.md
      - EVIDENCE_PRESENTATION.md
    notes: GLAZE UI can present evidence-backed security state but does not enforce security controls or inherit Wardveil authority. Consumer runtimes remain responsible for substantive Wardveil integration.
  everkeep:
    result: not-applicable-justified
    version: null
    evidence:
      - STABILITY.md
      - acceptance/v1.3-stable.md
      - releases/1.3.0.md
    notes: The shared design-system source owns no user backup or recovery state requiring an Everkeep runtime adapter. Versioned release and rollback records remain source-level provenance, while consumers retain their own Everkeep obligations.
  glaze_ui:
    result: not-applicable-justified
    version: 1.3.0
    evidence:
      - VERSION
      - GLAZE_UI_V1_3.md
      - registry/lifecycle.json
      - consumers/registry.json
      - acceptance/v1.3-stable.md
      - releases/1.3.0.md
    notes: This repository implements the GLAZE UI authority itself, so a separate GLAZE-UI-to-GLAZE-UI integration is not applicable.
  mesh:
    result: not-applicable-justified
    version: null
    evidence:
      - GLAZE_UI_V1_3.md
      - CONFORMANCE.md
    notes: GLAZE UI is distributed as versioned design-system source and does not perform service discovery, evidence transport, event routing, or runtime coordination. Consumers retain any applicable GoreeCloud Mesh obligations.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: not-applicable-justified
    version: null
    evidence:
      - SECURITY.md
      - STATES.md
    notes: GLAZE UI defines presentation primitives for identity and authorization surfaces but does not authenticate principals, issue credentials, own sessions, or authorize actions. Consumers retain GoreeCloud Identity obligations.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements: []
  restore:
    required: false
    requirements: []
  export:
    required: true
    requirements:
      - Keep Stable CSS, JavaScript, JSON contracts and tokens, Markdown specifications, reference assets, and release records independently retrievable in standard source formats.
  portability:
    required: true
    requirements:
      - Keep the design-system contract implementation-independent enough for web consumers and separately accepted native mappings without requiring a proprietary GoreeCloud runtime to interpret the Stable source specification.

external_dependencies: []


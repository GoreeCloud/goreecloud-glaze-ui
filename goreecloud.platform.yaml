      revision: 15cc76d2bcd4065552dc31c77145b63f34d9e7b2
      result: passed
      observed_at: "2026-09-03T11:59:57Z"
      notes: Stable source/runtime entrypoints and their compatibility contracts were validated on the exact release source; this design-system API is source-level rather than an HTTP service API.
    - id: glaze-v1.1-accessibility
      category: accessibility
      path: acceptance/v1.1-stable.md
      revision: 15cc76d2bcd4065552dc31c77145b63f34d9e7b2

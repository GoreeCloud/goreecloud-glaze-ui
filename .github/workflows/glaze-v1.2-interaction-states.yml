name: Glaze V1.2 Interaction States Candidate
on:
  push:
  pull_request:
jobs:
  interaction-states-rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve Stable and validate token authority
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py
          python scripts/validate_glaze_v1_2_core_tokens.py
      - name: Validate rendered V1.2 interaction states
        run: python scripts/validate_glaze_v1_2_interaction_states_rendered.py
      - name: Upload V1.2 interaction-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glaze-v1.2-interaction-states-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-v1.2-interaction-states-*
          if-no-files-found: error
          retention-days: 30

name: Glaze V1.2 Depth and Elevation Candidate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  depth-rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve Stable and Candidate source authority
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py
      - name: Validate rendered V1.2 Depth and Elevation Candidate
        run: python scripts/validate_glaze_v1_2_depth_rendered.py
      - name: Upload V1.2 Depth evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glaze-v1.2-depth-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-v1.2-depth-*.png
          if-no-files-found: error
          retention-days: 30

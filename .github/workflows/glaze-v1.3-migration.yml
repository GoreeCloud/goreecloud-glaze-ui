name: GLAZE UI V1.3 Migration and Consumer Boundary

on:
  push:
    branches:
      - feat/glaze-ui-v1.3-adaptive-resonance
    paths:
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'contracts/v1.3/migration.candidate.json'
      - 'contracts/v1.3/consumer-adoption-record.schema.json'
      - 'contracts/v1.3/accessibility.candidate.json'
      - 'contracts/v1.3/component-experience.candidate.json'
      - 'contracts/v1.2/migration.candidate.json'
      - 'consumers/registry.json'
      - 'ADOPTION.md'
      - 'CONFORMANCE.md'
      - 'CONSUMERS.md'
      - 'MIGRATION_V1_2_TO_V1_3.md'
      - 'js/glaze-v1.3-migration.candidate.mjs'
      - 'tests/glaze-v1.3-migration.test.mjs'
      - 'scripts/validate_glaze_v1_2_stable.py'
      - 'scripts/validate_glaze_v1_3_migration.py'
      - 'scripts/validate_glaze_v1_3_accessibility.py'
      - 'scripts/validate_glaze_v1_3_component_experience.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-migration.yml'
  pull_request:
    paths:
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'contracts/v1.3/migration.candidate.json'
      - 'contracts/v1.3/consumer-adoption-record.schema.json'
      - 'contracts/v1.3/accessibility.candidate.json'
      - 'contracts/v1.3/component-experience.candidate.json'
      - 'contracts/v1.2/migration.candidate.json'
      - 'consumers/registry.json'
      - 'ADOPTION.md'
      - 'CONFORMANCE.md'
      - 'CONSUMERS.md'
      - 'MIGRATION_V1_2_TO_V1_3.md'
      - 'js/glaze-v1.3-migration.candidate.mjs'
      - 'tests/glaze-v1.3-migration.test.mjs'
      - 'scripts/validate_glaze_v1_2_stable.py'
      - 'scripts/validate_glaze_v1_3_migration.py'
      - 'scripts/validate_glaze_v1_3_accessibility.py'
      - 'scripts/validate_glaze_v1_3_component_experience.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-migration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-v1-3-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile V1.3 validators
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_phase0.py
          python -m py_compile scripts/validate_glaze_v1_3_accessibility.py
          python -m py_compile scripts/validate_glaze_v1_3_component_experience.py
          python -m py_compile scripts/validate_glaze_v1_3_migration.py
      - name: Preserve V1.2 Stable authority
        run: python scripts/validate_glaze_v1_2_stable.py
      - name: Preserve V1.3 pre-promotion boundary
        run: python scripts/validate_glaze_v1_3_phase0.py
      - name: Revalidate Accessibility dependency
        run: python scripts/validate_glaze_v1_3_accessibility.py
      - name: Revalidate Signature Components and Reference Suite dependency
        run: python scripts/validate_glaze_v1_3_component_experience.py
      - name: Validate V1.3 Migration and Consumer Boundary
        run: python scripts/validate_glaze_v1_3_migration.py
      - name: Check migration evaluator syntax
        run: node --check js/glaze-v1.3-migration.candidate.mjs
      - name: Test migration evaluator
        run: node --test tests/glaze-v1.3-migration.test.mjs
      - name: Parse migration JSON authorities
        run: |
          python -m json.tool contracts/v1.3/migration.candidate.json >/dev/null
          python -m json.tool contracts/v1.3/consumer-adoption-record.schema.json >/dev/null
          python -m json.tool consumers/registry.json >/dev/null
          python -m json.tool contracts/v1.3/adaptive-resonance.plan.json >/dev/null

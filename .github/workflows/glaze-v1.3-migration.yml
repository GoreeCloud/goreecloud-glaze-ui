name: GLAZE UI V1.3 Stable Migration and Consumer Boundary

on:
  push:
    branches:
      - main
      - release/v1.3.0
    paths:
      - 'contracts/v1.3/migration.candidate.json'
      - 'contracts/v1.3/consumer-adoption-record.schema.json'
      - 'consumers/registry.json'
      - 'CONSUMERS.md'
      - 'MIGRATION_V1_2_TO_V1_3.md'
      - 'js/glaze-v1.3-migration.candidate.mjs'
      - 'js/glaze-v1.3.0.mjs'
      - 'tokens/glaze-v1.3.json'
      - 'acceptance/v1.3-stable.md'
      - 'acceptance/v1.3.1-hardening.md'
      - 'tests/glaze-v1.3-migration.test.mjs'
      - 'scripts/validate_glaze_v1_3_migration.py'
      - 'scripts/validate_glaze_v1_3_stable.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-migration.yml'
  pull_request:
    paths:
      - 'contracts/v1.3/migration.candidate.json'
      - 'contracts/v1.3/consumer-adoption-record.schema.json'
      - 'consumers/registry.json'
      - 'CONSUMERS.md'
      - 'MIGRATION_V1_2_TO_V1_3.md'
      - 'js/glaze-v1.3-migration.candidate.mjs'
      - 'js/glaze-v1.3.0.mjs'
      - 'tokens/glaze-v1.3.json'
      - 'acceptance/v1.3-stable.md'
      - 'acceptance/v1.3.1-hardening.md'
      - 'tests/glaze-v1.3-migration.test.mjs'
      - 'scripts/validate_glaze_v1_3_migration.py'
      - 'scripts/validate_glaze_v1_3_stable.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-migration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-v1-3-stable-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile V1.3 Stable validators
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_stable.py
          python -m py_compile scripts/validate_glaze_v1_3_migration.py
      - name: Validate V1.3 Stable lifecycle authority
        run: python scripts/validate_glaze_v1_3_stable.py
      - name: Validate V1.3 Migration and Consumer Boundary
        run: python scripts/validate_glaze_v1_3_migration.py
      - name: Check migration and Stable runtime syntax
        run: |
          node --check js/glaze-v1.3-migration.candidate.mjs
          node --check js/glaze-v1.3.0.mjs
      - name: Test migration evaluator
        run: node --test tests/glaze-v1.3-migration.test.mjs
      - name: Parse migration and Stable JSON authorities
        run: |
          python -m json.tool contracts/v1.3/migration.candidate.json >/dev/null
          python -m json.tool contracts/v1.3/consumer-adoption-record.schema.json >/dev/null
          python -m json.tool consumers/registry.json >/dev/null
          python -m json.tool registry/lifecycle.json >/dev/null
          python -m json.tool tokens/glaze-v1.3.json >/dev/null

name: GLAZE UI V1.3 Stable Authority

on:
  push:
    paths:
      - VERSION
      - GLAZE_UI_V1_3.md
      - GLAZE_UI_V1_3_1_HARDENING.md
      - FEATURE-ROADMAP.md
      - README.md
      - CONSUMERS.md
      - MIGRATION_V1_2_TO_V1_3.md
      - registry/lifecycle.json
      - consumers/registry.json
      - acceptance/v1.3-*.md
      - releases/1.3.0.md
      - css/**
      - js/**
      - contracts/v1.3/**
      - evidence/v1.3/**
      - website/**
      - scripts/validate_glaze_v1_3_*.py
      - scripts/validate_design_center_responsive.py
      - scripts/validate_design_center_mobile.py
      - .github/workflows/glaze-v1.3-stable-authority.yml
  pull_request:
    paths:
      - VERSION
      - GLAZE_UI_V1_3.md
      - GLAZE_UI_V1_3_1_HARDENING.md
      - FEATURE-ROADMAP.md
      - README.md
      - CONSUMERS.md
      - MIGRATION_V1_2_TO_V1_3.md
      - registry/lifecycle.json
      - consumers/registry.json
      - acceptance/v1.3-*.md
      - releases/1.3.0.md
      - css/**
      - js/**
      - contracts/v1.3/**
      - evidence/v1.3/**
      - website/**
      - scripts/validate_glaze_v1_3_*.py
      - scripts/validate_design_center_responsive.py
      - scripts/validate_design_center_mobile.py
      - .github/workflows/glaze-v1.3-stable-authority.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  stable-authority:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate V1.3 Stable lifecycle boundary
        run: python scripts/validate_glaze_v1_3_phase0.py

      - name: Validate V1.3 release and V1.3.1 follow-up control plane
        run: python scripts/validate_glaze_v1_3_planned.py

      - name: Validate preserved qualification evidence boundary
        run: python scripts/validate_glaze_v1_3_qualification.py

      - name: Validate Stable authority and historical readiness provenance
        run: python scripts/validate_glaze_v1_3_stable_readiness.py

      - name: Parse release authority JSON
        run: |
          python -m json.tool registry/lifecycle.json >/dev/null
          python -m json.tool consumers/registry.json >/dev/null
          python -m json.tool contracts/v1.3/deferred-qualification.plan.json >/dev/null
          python -m json.tool contracts/v1.3/qualification-matrix.json >/dev/null

      - name: Check Stable runtime syntax
        run: node --check js/glaze-v1.3.0.mjs

      - name: Resolve Stable runtime module graph
        run: |
          node -e "import('./js/glaze-v1.3.0.mjs').then(() => console.log('GLAZE UI V1.3 Stable runtime graph: PASS'))"

      - name: Verify Stable CSS source boundary
        run: |
          grep -F 'official Stable web entrypoint' css/glaze-v1.3.0.css
          grep -F '@import url("./glaze-v1.2.0.css");' css/glaze-v1.3.0.css

      - name: Validate Design Center authority publication
        run: python website/validate.py

      - name: Validate Design Center mobile-first source contract
        run: python scripts/validate_design_center_responsive.py

      - name: Validate rendered Design Center Mobile UI
        run: python scripts/validate_design_center_mobile.py

      - name: Verify release authority markers
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "1.3.0"
          grep -F '**Lifecycle:** Official Stable' GLAZE_UI_V1_3.md
          grep -F '**Status:** Official Stable release' acceptance/v1.3-stable.md
          grep -F 'V1.3.1' acceptance/v1.3-deferred-qualification.md
          grep -F 'consumer-eligible' releases/1.3.0.md

      - name: Report exact-revision Stable boundary
        run: |
          echo 'This exact checked source revision declares GLAZE UI V1.3 / 1.3.0 Official, Stable, and consumer-eligible.'
          echo 'Unresolved human/manual/physical-device/performance/native Personalization/source cleanup work remains V1.3.1 follow-up and is not represented as passed.'
          echo 'A successful workflow validates only this checked revision; merge, downstream conformance, and production acceptance remain separate decisions.'

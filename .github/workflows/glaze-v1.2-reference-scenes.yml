name: Glaze V1.2 Reference Scene Index Candidate

on:
  pull_request:
    paths:
      - "contracts/v1.2/reference-scenes.candidate.json"
      - "contracts/regression/visual-baselines-v1.json"
      - "contracts/regression/reference-invariants.json"
      - "tokens/icon-identity.json"
      - "reference/v1.2/**"
      - "scripts/validate_glaze_v1_2_*.py"
      - ".github/workflows/glaze-v1.2-reference-scenes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-2-reference-scenes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-scene-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Preserve Stable and Candidate authorities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py

      - name: Validate bounded V1.2 Phase 5 reference-scene index
        run: python scripts/validate_glaze_v1_2_reference_scene_index.py

      - name: Stage exact-revision Reference Scene review sources
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/reference-scenes"
          mkdir -p "$out/contracts"
          git rev-parse HEAD > "$out/REVISION"
          cp contracts/v1.2/reference-scenes.candidate.json "$out/contracts/"
          cp -R reference/v1.2 "$out/reference"

      - name: Upload exact-revision Reference Scene review sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.2-reference-scenes-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/reference-scenes/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

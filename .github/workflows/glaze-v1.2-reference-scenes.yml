name: Glaze V1.2 Reference Scene Index Candidate

on:
  pull_request:
    paths:
      - "contracts/v1.2/reference-scenes.candidate.json"
      - "contracts/regression/visual-baselines-v1.json"
      - "contracts/regression/reference-invariants.json"
      - "tokens/icon-identity.json"
      - "reference/v1.2/**"
      - "scripts/validate_glaze_v1_2_*.py"
      - ".github/workflows/glaze-v1.2-reference-scenes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-2-reference-scenes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-scene-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Preserve Stable and Candidate authorities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py

      - name: Validate bounded V1.2 Phase 5 reference-scene index
        run: python scripts/validate_glaze_v1_2_reference_scene_index.py

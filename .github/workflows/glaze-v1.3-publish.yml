name: Glaze V1.3.0 Stable Publication

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/glaze-v1.3-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glaze-v1.3.0-stable-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.3.0
  RELEASE_SHA: ff34f232f295c9dcb07e4c681f66d4104d0b9323
  RELEASE_TITLE: GLAZE UI V1.3.0 — Stable

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact V1.3.0 release authority
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          test "$(git show "${RELEASE_SHA}:VERSION" | tr -d '\r\n')" = "1.3.0"
          for path in \
            registry/lifecycle.json \
            GLAZE_UI_V1_3.md \
            acceptance/v1.3-stable.md \
            releases/1.3.0.md \
            css/glaze-v1.3.0.css \
            js/glaze-v1.3.0.mjs \
            MIGRATION_V1_2_TO_V1_3.md; do
            git cat-file -e "${RELEASE_SHA}:${path}"
          done
          git show "${RELEASE_SHA}:registry/lifecycle.json" > "${RUNNER_TEMP}/lifecycle.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lifecycle = json.loads(Path(os.environ['RUNNER_TEMP'], 'lifecycle.json').read_text())
          assert lifecycle['currentOfficial'] == '1.3.0'
          assert lifecycle['currentStable'] == '1.3.0'
          release = next(item for item in lifecycle['releases'] if item['version'] == '1.3.0')
          assert release['status'] == 'stable'
          assert release['consumerEligible'] is True
          assert lifecycle['plannedNext'] == '1.3.1-candidate'
          PY
          git show "${RELEASE_SHA}:releases/1.3.0.md" > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish exact annotated tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          existing_direct="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          existing_peeled="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          if [ -n "${existing_direct}" ]; then
            if [ -n "${existing_peeled}" ]; then
              test "${existing_peeled}" = "${RELEASE_SHA}"
            else
              test "${existing_direct}" = "${RELEASE_SHA}"
            fi
            echo "${RELEASE_TAG} already exists at the intended V1.3.0 release authority."
          else
            git config user.name "GoreeCloud Release Automation"
            git config user.email "295260680+GoreeCloud@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "${RELEASE_TITLE}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            existing="$(gh release view "${RELEASE_TAG}" --json tagName,name,isDraft,isPrerelease --jq '[.tagName,.name,(.isDraft|tostring),(.isPrerelease|tostring)] | @tsv')"
            expected="${RELEASE_TAG}\t${RELEASE_TITLE}\tfalse\tfalse"
            test "${existing}" = "${expected}"
            echo "GitHub Release already exists with the intended Stable identity."
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TITLE}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --latest
          fi

      - name: Verify published distribution identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          peeled="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          direct="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [ -n "${peeled}" ]; then
            test "${peeled}" = "${RELEASE_SHA}"
          else
            test "${direct}" = "${RELEASE_SHA}"
          fi
          gh release view "${RELEASE_TAG}" --json url,tagName,name,isDraft,isPrerelease,publishedAt

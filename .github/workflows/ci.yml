name: GLAZE UI V1.1 CI

on:
  push:
  pull_request:

jobs:
  validate-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current GLAZE UI V1.1 Stable contract
        run: python scripts/validate_glaze_v1.py
      - name: Validate V1.2 Frosted Neutral Candidate track
        run: python scripts/validate_glaze_v1_2_candidate.py
      - name: Validate V1.2 implementation and migration control plane
        run: python scripts/validate_glaze_v1_2_migration.py
      - name: Validate rendered V1.2 Frosted Optical foundation
        run: python scripts/validate_glaze_v1_2_optical_rendered.py
      - name: Validate rendered V1.2 Frosted Optical chrome
        run: python scripts/validate_glaze_v1_2_chrome_rendered.py
      - name: Validate rendered V1.2 Crystal Icon System
        run: python scripts/validate_glaze_v1_2_crystal_icons_rendered.py
      - name: Validate rendered V1.2 Glaze Sans Optical typography
        run: python scripts/validate_glaze_v1_2_typography_rendered.py
      - name: Validate rendered V1.2 spatial foundation
        run: python scripts/validate_glaze_v1_2_spatial_rendered.py
      - name: Validate rendered V1.2 Frosted Neutral Candidate
        run: python scripts/validate_glaze_v1_2_rendered.py
      - name: Upload V1.2 Frosted Neutral rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glaze-v1.2-frosted-neutral-rendered
          path: artifacts/glaze-v1.2-*.png
          if-no-files-found: warn
      - name: Validate V1 Design Center publication
        run: python website/validate.py
      - name: Validate Design Center mobile-first source contract
        run: python scripts/validate_design_center_responsive.py
      - name: Validate rendered Design Center Mobile UI
        run: python scripts/validate_design_center_mobile.py
      - name: Upload Design Center Mobile UI review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-center-mobile-ui
          path: artifacts/design-center-mobile-*.png
          if-no-files-found: warn
      - name: Check V1 runtime syntax
        run: node --check js/glaze-v1.1.0.mjs

  validate-v1-2-linux-gtk-candidate:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'feat/glaze-v1.2-linux-native') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/glaze-v1.2-linux-native')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile Linux native Candidate sources
        run: |
          python3 -m py_compile reference/v1.2/native/linux-gtk/app.py
          python3 -m py_compile scripts/validate_glaze_v1_2_linux_runtime.py
          python3 -m json.tool reference/v1.2/native/linux-gtk/material-contract.json >/dev/null
      - name: Preserve current Stable and V1.2 Candidate source contracts
        run: |
          python3 scripts/validate_glaze_v1.py
          python3 scripts/validate_glaze_v1_2_candidate.py
      - name: Install GTK4 headless evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            gir1.2-gtk-4.0 \
            xvfb \
            xauth \
            dbus-x11 \
            imagemagick
          python3 - <<'PY'
          import gi
          gi.require_version('Gtk', '4.0')
          from gi.repository import Gtk
          print(f'GTK {Gtk.get_major_version()}.{Gtk.get_minor_version()}.{Gtk.get_micro_version()}')
          PY
          import -version | head -n 1
      - name: Run V1.2 Linux GTK4 Frosted Neutral native acceptance
        shell: bash
        env:
          GLAZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          NO_AT_BRIDGE: '1'
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a --server-args='-screen 0 1280x900x24 -nolisten tcp' \
            python3 scripts/validate_glaze_v1_2_linux_runtime.py
      - name: Upload V1.2 Linux GTK native Candidate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glaze-v1.2-linux-gtk-native-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .artifacts/glaze-v1.2-linux-native/*.png
            .artifacts/glaze-v1.2-linux-native/linux-native-evidence.json
            .artifacts/glaze-v1.2-linux-native/*/runtime.json
          if-no-files-found: error
          retention-days: 30

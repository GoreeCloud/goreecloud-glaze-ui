name: Glaze UI Semantic Color Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-colors:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Compile semantic color validator
        run: python3 -m py_compile scripts/validate_semantic_colors.py
      - name: Validate semantic color contract
        run: python3 scripts/validate_semantic_colors.py

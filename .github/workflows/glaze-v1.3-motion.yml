name: GLAZE UI V1.3 Motion and Continuity

on:
  push:
    branches:
      - feat/glaze-ui-v1.3-adaptive-resonance
    paths:
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'contracts/v1.3/motion-semantics.candidate.json'
      - 'contracts/v1.3/living-material-2.candidate.json'
      - 'contracts/v1.3/adaptive-navigation.candidate.json'
      - 'contracts/v1.2/motion.candidate.json'
      - 'contracts/v1.2/context-continuity.candidate.json'
      - 'tokens/glaze-v1.3-motion.candidate.json'
      - 'tokens/glaze-v1.2-motion.candidate.json'
      - 'js/glaze-v1.3-motion.candidate.mjs'
      - 'tests/glaze-v1.3-motion.test.mjs'
      - 'scripts/validate_glaze_v1_3_motion.py'
      - 'scripts/validate_glaze_v1_3_token_architecture.py'
      - 'scripts/validate_glaze_v1_3_living_material_2.py'
      - 'scripts/validate_glaze_v1_3_adaptive_navigation.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-motion.yml'
  pull_request:
    paths:
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'contracts/v1.3/motion-semantics.candidate.json'
      - 'contracts/v1.3/living-material-2.candidate.json'
      - 'contracts/v1.3/adaptive-navigation.candidate.json'
      - 'contracts/v1.2/motion.candidate.json'
      - 'contracts/v1.2/context-continuity.candidate.json'
      - 'tokens/glaze-v1.3-motion.candidate.json'
      - 'tokens/glaze-v1.2-motion.candidate.json'
      - 'js/glaze-v1.3-motion.candidate.mjs'
      - 'tests/glaze-v1.3-motion.test.mjs'
      - 'scripts/validate_glaze_v1_3_motion.py'
      - 'scripts/validate_glaze_v1_3_token_architecture.py'
      - 'scripts/validate_glaze_v1_3_living_material_2.py'
      - 'scripts/validate_glaze_v1_3_adaptive_navigation.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-motion.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-v1-3-motion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile V1.3 validators
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_phase0.py
          python -m py_compile scripts/validate_glaze_v1_3_token_architecture.py
          python -m py_compile scripts/validate_glaze_v1_3_living_material_2.py
          python -m py_compile scripts/validate_glaze_v1_3_adaptive_navigation.py
          python -m py_compile scripts/validate_glaze_v1_3_motion.py
      - name: Preserve V1.2 Stable authority
        run: python scripts/validate_glaze_v1_2_stable.py
      - name: Preserve V1.3 pre-promotion boundary
        run: python scripts/validate_glaze_v1_3_phase0.py
      - name: Revalidate V1.3 token architecture
        run: python scripts/validate_glaze_v1_3_token_architecture.py
      - name: Revalidate V1.3 Living Material 2.0 dependency
        run: python scripts/validate_glaze_v1_3_living_material_2.py
      - name: Revalidate V1.3 Adaptive Navigation dependency
        run: python scripts/validate_glaze_v1_3_adaptive_navigation.py
      - name: Validate V1.3 Motion and Continuity
        run: python scripts/validate_glaze_v1_3_motion.py
      - name: Check motion runtime syntax
        run: node --check js/glaze-v1.3-motion.candidate.mjs
      - name: Test motion runtime
        run: node --test tests/glaze-v1.3-motion.test.mjs
      - name: Parse motion JSON
        run: |
          python -m json.tool contracts/v1.3/motion-semantics.candidate.json >/dev/null
          python -m json.tool tokens/glaze-v1.3-motion.candidate.json >/dev/null
          python -m json.tool contracts/v1.3/adaptive-resonance.plan.json >/dev/null

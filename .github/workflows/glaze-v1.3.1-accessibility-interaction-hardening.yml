name: GLAZE UI V1.3.1 Accessibility Interaction Hardening

on:
  push:
    branches:
      - feat/glaze-ui-v1.3.1-accessibility-hardening
    paths:
      - 'contracts/v1.3.1/**'
      - 'css/glaze-v1.3.1-**'
      - 'js/glaze-v1.3.1-**'
      - 'reference/v1.3/accessibility-interaction-hardening.html'
      - 'tests/glaze-v1.3.1-**'
      - 'scripts/validate_glaze_v1_3_1_**'
      - '.github/workflows/glaze-v1.3.1-accessibility-interaction-hardening.yml'
  pull_request:
    paths:
      - 'contracts/v1.3.1/**'
      - 'css/glaze-v1.3.1-**'
      - 'js/glaze-v1.3.1-**'
      - 'reference/v1.3/accessibility-interaction-hardening.html'
      - 'tests/glaze-v1.3.1-**'
      - 'scripts/validate_glaze_v1_3_1_**'
      - '.github/workflows/glaze-v1.3.1-accessibility-interaction-hardening.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate hardening contract and reference layer
        run: python scripts/validate_glaze_v1_3_1_accessibility_interaction_hardening.py
      - name: Test hardening runtime
        run: node --test tests/glaze-v1.3.1-accessibility-interaction-hardening.test.mjs
      - name: Re-run inherited V1.3 accessibility runtime tests
        run: node --test tests/glaze-v1.3-accessibility.test.mjs
      - name: Parse hardening contract JSON
        run: python -m json.tool contracts/v1.3.1/accessibility-interaction-hardening.candidate.json >/dev/null

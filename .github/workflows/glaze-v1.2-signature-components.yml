name: Glaze V1.2 Signature Components Candidate

on:
  push:
  pull_request:

jobs:
  signature-components-rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve Stable and Candidate source authority
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py
          python scripts/validate_glaze_v1_2_core_tokens.py
          node --check js/glaze-v1.2-signature.candidate.mjs
      - name: Validate rendered V1.2 Signature components
        run: python scripts/validate_glaze_v1_2_signature_components_rendered.py
      - name: Upload V1.2 Signature component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glaze-v1.2-signature-components-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-v1.2-signature-components-*
          if-no-files-found: error
          retention-days: 30

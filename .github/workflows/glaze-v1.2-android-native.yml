name: Glaze V1.2 Android Native Candidate

on:
  push:
    branches:
      - feat/glaze-v1.2-migration-control-plane
  pull_request:
    paths:
      - 'reference/v1.2/native/android/**'
      - 'scripts/validate_glaze_v1_2_android_runtime.py'
      - 'scripts/validate_glaze_v1_2_android_personalization_runtime.py'
      - 'acceptance/v1.2-android-native-candidate.md'
      - '.github/workflows/glaze-v1.2-android-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-handheld-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Compile V1.2 Android native validators
        run: |
          python3 -m py_compile scripts/validate_glaze_v1_2_android_runtime.py
          python3 -m py_compile scripts/validate_glaze_v1_2_android_personalization_runtime.py

      - name: Preserve current Stable and Candidate source contracts
        run: |
          python3 scripts/validate_glaze_v1.py
          python3 scripts/validate_glaze_v1_2_candidate.py

      - name: Resolve Android SDK and stable handheld emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          ANDROID_IMAGE="$("$SDKMANAGER" --list --verbose | grep -E '^system-images;android-[0-9]+(-ext[0-9]+)?;google_apis;x86_64$' | sort -V | tail -n 1)"
          test -n "$ANDROID_IMAGE"
          echo "Using Android emulator system image: $ANDROID_IMAGE"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_IMAGE=$ANDROID_IMAGE" >> "$GITHUB_ENV"

      - name: Install Android emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-36" "$ANDROID_IMAGE"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/emulator/emulator"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install verified Gradle 9.5.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-9.5.0-bin.zip --output /tmp/gradle-9.5.0-bin.zip
          echo "553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746  /tmp/gradle-9.5.0-bin.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle-9.5.0-bin.zip -d /tmp
          echo "/tmp/gradle-9.5.0/bin" >> "$GITHUB_PATH"

      - name: Build GLAZE UI V1.2 Android Native Candidate APK
        working-directory: reference/v1.2/native/android
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Create deterministic Android handheld emulator
        shell: bash
        run: |
          set -euo pipefail
          AVD_NAME=glaze-v12-android-native
          AVD_ROOT="$HOME/.android/avd"
          AVD_DIR="$AVD_ROOT/$AVD_NAME.avd"
          IMAGE_RELATIVE="${ANDROID_IMAGE//;/\/}/"
          IMAGE_DIR="$SDK_ROOT/$IMAGE_RELATIVE"
          test -f "$IMAGE_DIR/system.img"
          test -f "$IMAGE_DIR/kernel-ranchu"
          mkdir -p "$AVD_DIR"
          cat > "$AVD_ROOT/$AVD_NAME.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/$AVD_NAME.avd
          target=android-36
          EOF
          cat > "$AVD_DIR/config.ini" <<EOF
          AvdId=$AVD_NAME
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=GLAZE UI V1.2 Native Candidate
          avd.ini.encoding=UTF-8
          disk.dataPartition.size=4G
          fastboot.forceColdBoot=yes
          fastboot.forceFastBoot=no
          hw.accelerometer=yes
          hw.audioInput=no
          hw.battery=yes
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.device.manufacturer=GoreeCloud-CI
          hw.device.name=glaze_v12_android_handheld
          hw.gps=yes
          hw.keyboard=yes
          hw.lcd.circular=false
          hw.lcd.density=420
          hw.lcd.height=2400
          hw.lcd.width=1080
          hw.mainKeys=no
          hw.ramSize=2048
          hw.sdCard=no
          hw.sensors.orientation=yes
          hw.sensors.proximity=yes
          hw.trackBall=no
          image.sysdir.1=$IMAGE_RELATIVE
          runtime.network.latency=none
          runtime.network.speed=full
          skin.dynamic=yes
          tag.display=Google APIs
          tag.id=google_apis
          vm.heapSize=512
          EOF
          "$SDK_ROOT/emulator/emulator" -list-avds | grep -Fx "$AVD_NAME"
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi

      - name: Boot and install V1.2 Android Candidate
        shell: bash
        env:
          APK_PATH: reference/v1.2/native/android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          EMULATOR_LOG="$RUNNER_TEMP/glaze-v12-android-emulator.log"
          nohup "$SDK_ROOT/emulator/emulator" -avd glaze-v12-android-native -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -camera-back none -camera-front none >"$EMULATOR_LOG" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/glaze-v12-android-emulator.pid"
          adb wait-for-device
          BOOTED=0
          for _ in $(seq 1 150); do
            if test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"; then BOOTED=1; break; fi
            sleep 2
          done
          test "$BOOTED" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r "$APK_PATH"
          adb shell pm path com.goreecloud.glazeui.reference.v12 | grep -F 'package:'

      - name: Run V1.2 Android Frosted Neutral emulator acceptance
        env:
          GLAZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/validate_glaze_v1_2_android_runtime.py

      - name: Run V1.2 Android Personalization adapter emulator evidence
        env:
          GLAZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/validate_glaze_v1_2_android_personalization_runtime.py

      - name: Upload V1.2 Android native Candidate evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.2-android-native-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            reference/v1.2/native/android/app/build/outputs/apk/debug/app-debug.apk
            .artifacts/glaze-v1.2-android-native/*.png
            .artifacts/glaze-v1.2-android-native/android-native-evidence.json
            .artifacts/glaze-v1.2-android-native/android-personalization-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve emulator diagnostics on failure
        if: failure()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/glaze-v12-android-emulator.log" || tail -n 300 "$RUNNER_TEMP/glaze-v12-android-emulator.log"
          adb devices -l || true

      - name: Stop Android emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if test -f "$RUNNER_TEMP/glaze-v12-android-emulator.pid"; then kill "$(cat "$RUNNER_TEMP/glaze-v12-android-emulator.pid")" >/dev/null 2>&1 || true; fi

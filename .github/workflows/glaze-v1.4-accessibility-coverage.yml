name: Glaze V1.4 Accessibility Coverage Candidate

on:
  pull_request:
    paths:
      - "scripts/summarize_glaze_v1_4_accessibility_coverage.py"
      - "tests/test_glaze_v1_4_accessibility_coverage.py"
      - "contracts/v1.4/accessibility-qualification.candidate.json"
      - "evidence/v1.4/templates/accessibility-qualification-record.candidate.json"
      - ".github/workflows/glaze-v1.4-accessibility-coverage.yml"
  push:
    branches: [main]
    paths:
      - "scripts/summarize_glaze_v1_4_accessibility_coverage.py"
      - "tests/test_glaze_v1_4_accessibility_coverage.py"
      - "contracts/v1.4/accessibility-qualification.candidate.json"
      - "evidence/v1.4/templates/accessibility-qualification-record.candidate.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test qualification coverage summary
        run: python3 tests/test_glaze_v1_4_accessibility_coverage.py
      - name: Compile coverage tooling
        run: >-
          python3 -m py_compile
          scripts/summarize_glaze_v1_4_accessibility_coverage.py
          tests/test_glaze_v1_4_accessibility_coverage.py

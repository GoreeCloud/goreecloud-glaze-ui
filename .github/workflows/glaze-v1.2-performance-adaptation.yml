name: Glaze V1.2 Performance Adaptation Candidate

on:
  pull_request:
    paths:
      - "contracts/performance/glaze-v1-performance-budget.json"
      - "contracts/v1.2/performance-adaptation.candidate.json"
      - "contracts/accessibility/resolution-matrix.json"
      - "css/glaze-v1.2-optical.candidate.css"
      - "css/glaze-v1.2-motion.candidate.css"
      - "css/glaze-v1.2-depth-fallbacks.candidate.css"
      - "css/glaze-v1.2-accessibility.candidate.css"
      - "css/glaze-v1.2.0-candidate.css"
      - "reference/v1.2/performance-adaptation.html"
      - "scripts/validate_glaze_v1_2_performance_adaptation_rendered.py"
      - ".github/workflows/glaze-v1.2-performance-adaptation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-2-performance-adaptation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance-adaptation-rendered:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Preserve Stable and Candidate authorities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py
          python scripts/validate_glaze_v1_2_core_tokens.py
          python scripts/validate_glaze_v1_2_form_factor_tokens.py

      - name: Validate rendered V1.2 Performance Adaptation behavior
        run: python scripts/validate_glaze_v1_2_performance_adaptation_rendered.py

      - name: Upload V1.2 Performance Adaptation observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.2-performance-adaptation-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-v1.2-performance-adaptation-*
          if-no-files-found: error
          retention-days: 14

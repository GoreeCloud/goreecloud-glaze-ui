name: Validate GoreeCloud Care V1.2 consumer prequalification

on:
  pull_request:
    paths:
      - 'acceptance/goreecloud-care-v1.2-rc-prequalification.json'
      - 'consumers/registry.json'
      - 'scripts/validate_goreecloud_care_v1_2_prequalification.py'
      - 'scripts/validate_consumer_registry.py'
      - '.github/workflows/glaze-v1.2-care-consumer-prequalification.yml'
  push:
    branches:
      - main
      - 'governance/**'
    paths:
      - 'acceptance/goreecloud-care-v1.2-rc-prequalification.json'
      - 'consumers/registry.json'
      - 'scripts/validate_goreecloud_care_v1_2_prequalification.py'
      - 'scripts/validate_consumer_registry.py'
      - '.github/workflows/glaze-v1.2-care-consumer-prequalification.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Validate authoritative Glaze consumer registry
        run: python3 scripts/validate_consumer_registry.py

      - name: Validate GoreeCloud Care V1.2 RC prequalification
        run: python3 scripts/validate_goreecloud_care_v1_2_prequalification.py

name: Glaze V1.2 Performance Testing Candidate

on:
  pull_request:
    paths:
      - "contracts/performance/glaze-v1-performance-budget.json"
      - "contracts/v1.2/performance-adaptation.candidate.json"
      - "contracts/v1.2/performance-testing.candidate.json"
      - "contracts/v1.2/motion.candidate.json"
      - "contracts/v1.2/data-visualization.candidate.json"
      - "contracts/v1.2/productive-interfaces.candidate.json"
      - "reference/v1.2/performance-adaptation.html"
      - "reference/v1.2/motion.html"
      - "reference/v1.2/data-visualization.html"
      - "reference/v1.2/productive-interfaces.html"
      - "js/glaze-v1.2-data-visualization.candidate.mjs"
      - "js/glaze-v1.2-productive-interfaces.candidate.mjs"
      - "scripts/validate_glaze_v1_2_performance_adaptation_rendered.py"
      - "scripts/validate_glaze_v1_2_performance_testing.py"
      - ".github/workflows/glaze-v1.2-performance-testing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-2-performance-testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-performance-measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Preserve Stable and Candidate authorities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py

      - name: Compile bounded Performance Testing validator
        run: python -m py_compile scripts/validate_glaze_v1_2_performance_testing.py

      - name: Record exact-head bounded Performance Testing evidence
        run: python scripts/validate_glaze_v1_2_performance_testing.py

      - name: Upload bounded V1.2 Performance Testing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glaze-v1.2-performance-testing-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/glaze-v1.2-performance-testing-*.png
            artifacts/glaze-v1.2-performance-testing-evidence.json
            artifacts/glaze-v1.2-performance-adaptation-*.png
          if-no-files-found: error
          retention-days: 14

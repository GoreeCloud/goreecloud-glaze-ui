name: GLAZE UI V1.2 Retained Stable Integrity

on:
  pull_request:
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "css/glaze-v1.2.0.css"
      - "js/glaze-v1.2.0.mjs"
      - "acceptance/v1.2-stable.md"
      - "tokens/glaze-v1.2-**"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - ".github/workflows/glaze-v1.2-stable.yml"
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "css/glaze-v1.2.0.css"
      - "js/glaze-v1.2.0.mjs"
      - "acceptance/v1.2-stable.md"
      - "tokens/glaze-v1.2-**"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - ".github/workflows/glaze-v1.2-stable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-stable-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Validate live Stable authority and retained V1.2 source
        run: |
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_stable.py
          python scripts/validate_glaze_v1_2_candidate.py

      - name: Report authority boundary
        run: |
          echo 'V1.2 remains retained Stable provenance and rollback history.'
          echo 'This workflow derives current global Stable authority from VERSION/registry lifecycle and never moves it back to V1.2.'
          echo 'No V1.4.1 human, native-platform, physical-device, or promotion acceptance is implied.'

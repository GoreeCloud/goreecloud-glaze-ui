name: GLAZE UI V1.3 Accessibility and Resilience

on:
  push:
    branches:
      - feat/glaze-ui-v1.3-adaptive-resonance
    paths:
      - 'contracts/accessibility/resolution-matrix.json'
      - 'contracts/v1.2/accessibility-adaptation.candidate.json'
      - 'contracts/v1.2/accessibility-testing.candidate.json'
      - 'contracts/v1.2/assistive-technology-qualification.candidate.json'
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'contracts/v1.3/accessibility.candidate.json'
      - 'contracts/v1.3/dynamic-color.candidate.json'
      - 'contracts/v1.3/typography.candidate.json'
      - 'contracts/v1.3/living-material-2.candidate.json'
      - 'contracts/v1.3/reachability.candidate.json'
      - 'contracts/v1.3/motion-semantics.candidate.json'
      - 'js/glaze-v1.3-accessibility.candidate.mjs'
      - 'tests/glaze-v1.3-accessibility.test.mjs'
      - 'scripts/validate_glaze_v1_3_accessibility.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-accessibility.yml'
  pull_request:
    paths:
      - 'contracts/accessibility/resolution-matrix.json'
      - 'contracts/v1.2/accessibility-adaptation.candidate.json'
      - 'contracts/v1.2/accessibility-testing.candidate.json'
      - 'contracts/v1.2/assistive-technology-qualification.candidate.json'
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'contracts/v1.3/accessibility.candidate.json'
      - 'contracts/v1.3/dynamic-color.candidate.json'
      - 'contracts/v1.3/typography.candidate.json'
      - 'contracts/v1.3/living-material-2.candidate.json'
      - 'contracts/v1.3/reachability.candidate.json'
      - 'contracts/v1.3/motion-semantics.candidate.json'
      - 'js/glaze-v1.3-accessibility.candidate.mjs'
      - 'tests/glaze-v1.3-accessibility.test.mjs'
      - 'scripts/validate_glaze_v1_3_accessibility.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-accessibility.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-v1-3-accessibility-resilience:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile V1.3 validators
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_phase0.py
          python -m py_compile scripts/validate_glaze_v1_3_dynamic_color.py
          python -m py_compile scripts/validate_glaze_v1_3_typography.py
          python -m py_compile scripts/validate_glaze_v1_3_living_material_2.py
          python -m py_compile scripts/validate_glaze_v1_3_reachability.py
          python -m py_compile scripts/validate_glaze_v1_3_motion.py
          python -m py_compile scripts/validate_glaze_v1_3_accessibility.py
      - name: Preserve V1.2 Stable authority
        run: python scripts/validate_glaze_v1_2_stable.py
      - name: Preserve V1.3 pre-promotion boundary
        run: python scripts/validate_glaze_v1_3_phase0.py
      - name: Revalidate Dynamic Color dependency
        run: python scripts/validate_glaze_v1_3_dynamic_color.py
      - name: Revalidate Responsive Typography dependency
        run: python scripts/validate_glaze_v1_3_typography.py
      - name: Revalidate Living Material 2.0 dependency
        run: python scripts/validate_glaze_v1_3_living_material_2.py
      - name: Revalidate Human Reachability dependency
        run: python scripts/validate_glaze_v1_3_reachability.py
      - name: Revalidate Motion and Continuity dependency
        run: python scripts/validate_glaze_v1_3_motion.py
      - name: Validate V1.3 Accessibility and Resilience
        run: python scripts/validate_glaze_v1_3_accessibility.py
      - name: Check accessibility runtime syntax
        run: node --check js/glaze-v1.3-accessibility.candidate.mjs
      - name: Test accessibility runtime
        run: node --test tests/glaze-v1.3-accessibility.test.mjs
      - name: Parse accessibility JSON
        run: |
          python -m json.tool contracts/v1.3/accessibility.candidate.json >/dev/null
          python -m json.tool contracts/v1.3/adaptive-resonance.plan.json >/dev/null
          python -m json.tool contracts/accessibility/resolution-matrix.json >/dev/null

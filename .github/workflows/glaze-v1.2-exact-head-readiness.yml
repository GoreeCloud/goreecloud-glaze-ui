name: Glaze V1.2 Exact-Head Stable Readiness

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "GLAZE_UI_V1_2_CANDIDATE.md"
      - "contracts/v1.2/**"
      - "contracts/v1.3/**"
      - "css/glaze-v1.2-**"
      - "js/glaze-v1.2-**"
      - "reference/v1.2/**"
      - "acceptance/v1.2-**"
      - "acceptance/v1.3-stable.md"
      - "acceptance/v1.3-deferred-qualification.md"
      - "GLAZE_UI_V1_3_1_HARDENING.md"
      - "consumers/**"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_2_candidate.py"
      - "scripts/validate_glaze_v1_2_candidate_legacy.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - "scripts/validate_glaze_v1_2_living_glaze.py"
      - "scripts/validate_glaze_v1_2_living_glaze_legacy.py"
      - "scripts/glaze_v1_2_promoted_source_runner.py"
      - ".github/workflows/glaze-v1.2-exact-head-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-readiness:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact current revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Validate current Stable and retained V1.2 authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat VERSION)" = "1.3.0"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_stable.py

      - name: Validate retained promoted V1.2 source layer
        run: |
          python scripts/validate_glaze_v1_2_candidate.py
          python scripts/validate_glaze_v1_2_living_glaze.py

      - name: Record current-versus-retained lifecycle boundary
        env:
          GLAZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('.')
          lifecycle = json.loads((root / 'registry/lifecycle.json').read_text(encoding='utf-8'))
          consumers = json.loads((root / 'consumers/registry.json').read_text(encoding='utf-8'))
          deferred = (root / 'acceptance/v1.3-deferred-qualification.md').read_text(encoding='utf-8')

          assert lifecycle.get('currentStable') == '1.3.0'
          assert lifecycle.get('currentOfficial') == '1.3.0'
          assert lifecycle.get('activeCandidate') is None
          assert lifecycle.get('plannedNext') == '1.3.1-candidate'
          retained = next(item for item in lifecycle.get('releases', []) if item.get('version') == '1.2.0')
          assert retained.get('status') == 'stable'
          assert retained.get('consumerEligible') is True
          assert retained.get('stableBaseline') == '1.1.0'
          assert consumers.get('requiredConsumerVersion') == '1.3.0'
          assert 'does **not** manufacture' in deferred
          assert 'missing evidence as passed' in deferred

          report = {
              'schemaVersion': 4,
              'status': 'pass',
              'repository': 'GoreeCloud/goreecloud-glaze-ui',
              'revision': os.environ['GLAZE_SOURCE_REVISION'],
              'currentAuthority': {
                  'version': '1.3.0',
                  'lifecycle': 'stable',
                  'consumerEligible': True,
                  'activeCandidate': None,
                  'plannedNext': '1.3.1-candidate',
              },
              'retainedV12': {
                  'version': '1.2.0',
                  'status': retained.get('status'),
                  'consumerEligibleForRollbackAudit': retained.get('consumerEligible'),
                  'stableBaseline': retained.get('stableBaseline'),
                  'representedAsCurrentStable': False,
              },
              'v131DeferredQualification': {
                  'representedAsPassed': False,
                  'automaticLifecyclePromotion': False,
              },
              'downstreamConsumerAcceptanceImplied': False,
          }
          out = root / 'artifacts/glaze-v1.2-retained-source-boundary.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('GLAZE UI retained V1.2 exact-head boundary: PASS')
          print('V1.3 / 1.3.0 remains current Stable; V1.2 is retained rollback/audit source and V1.3.1 evidence remains unpassed.')
          PY

      - name: Upload retained-source boundary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.2-retained-source-boundary-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-v1.2-retained-source-boundary.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

name: Glaze V1.2 Exact-Head Readiness Candidate

on:
  pull_request:
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "contracts/v1.2/**"
      - "tokens/glaze-v1.2-**"
      - "css/glaze-v1.2-**"
      - "js/glaze-v1.2-**"
      - "reference/v1.2/**"
      - "contracts/performance/glaze-v1-performance-budget.json"
      - "contracts/glaze.conformance-evidence.schema.json"
      - "acceptance/v1.2-**"
      - "scripts/validate_glaze_v1_2_**"
      - ".github/workflows/glaze-v1.2-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-readiness:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Preserve Stable and Candidate authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat VERSION)" = "1.1.0"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py

      - name: Compile exact-head bounded readiness validators
        run: |
          python -m py_compile \
            scripts/validate_glaze_v1_2_exact_head_readiness.py \
            scripts/validate_glaze_v1_2_human_optical_review_packet.py \
            scripts/validate_glaze_v1_2_living_glaze.py \
            scripts/validate_glaze_v1_2_living_glaze_rendered.py \
            scripts/validate_glaze_v1_2_personalization_readiness.py \
            scripts/validate_glaze_v1_2_native_personalization_source.py \
            scripts/validate_glaze_v1_2_personalization_appearance_rendered.py \
            scripts/validate_glaze_v1_2_linux_window_adaptation_source.py

      - name: Validate Living Frosted source authority
        run: python scripts/validate_glaze_v1_2_living_glaze.py

      - name: Generate fail-closed Personalization readiness evidence
        run: python scripts/validate_glaze_v1_2_personalization_readiness.py

      - name: Generate fail-closed native Personalization source readiness evidence
        run: python scripts/validate_glaze_v1_2_native_personalization_source.py

      - name: Generate fail-closed Linux window adaptation source readiness evidence
        env:
          GLAZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/validate_glaze_v1_2_linux_window_adaptation_source.py

      - name: Generate fail-closed exact-head readiness evidence
        run: python scripts/validate_glaze_v1_2_exact_head_readiness.py

      - name: Generate fail-closed human optical review manifest
        run: python scripts/validate_glaze_v1_2_human_optical_review_packet.py

      - name: Upload bounded exact-head readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.2-exact-head-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/glaze-v1.2-exact-head-readiness.json
            artifacts/glaze-v1.2-human-optical-review-manifest.json
            artifacts/glaze-v1.2-personalization-readiness.json
            artifacts/glaze-v1.2-native-personalization-source-readiness.json
            artifacts/glaze-v1.2-linux-window-adaptation-source-readiness.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

name: Glaze V1.2 Retained Stable Exact-Revision Integrity

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "GLAZE_UI_V1_2_CANDIDATE.md"
      - "contracts/v1.2/**"
      - "tokens/glaze-v1.2-**"
      - "css/glaze-v1.2-**"
      - "js/glaze-v1.2-**"
      - "reference/v1.2/**"
      - "acceptance/v1.2-**"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_2_candidate.py"
      - "scripts/validate_glaze_v1_2_candidate_legacy.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - "scripts/validate_glaze_v1_2_documentation_versions.py"
      - "scripts/glaze_v1_2_promoted_source_runner.py"
      - ".github/workflows/glaze-v1.2-exact-head-readiness.yml"
  pull_request:
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "GLAZE_UI_V1_2_CANDIDATE.md"
      - "contracts/v1.2/**"
      - "tokens/glaze-v1.2-**"
      - "css/glaze-v1.2-**"
      - "js/glaze-v1.2-**"
      - "reference/v1.2/**"
      - "acceptance/v1.2-**"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_2_candidate.py"
      - "scripts/validate_glaze_v1_2_candidate_legacy.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - "scripts/validate_glaze_v1_2_documentation_versions.py"
      - "scripts/glaze_v1_2_promoted_source_runner.py"
      - ".github/workflows/glaze-v1.2-exact-head-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-exact-revision-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Validate live Stable authority and retained V1.2 release
        run: |
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_stable.py
          python scripts/validate_glaze_v1_2_candidate.py

      - name: Audit lifecycle/documentation authority
        run: |
          python scripts/validate_glaze_v1_2_documentation_versions.py \
            --output artifacts/glaze-v1.2-retained-lifecycle-version-integrity.json

      - name: Record retained-release boundary
        env:
          GLAZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path('.')
          lifecycle = json.loads((root / 'registry/lifecycle.json').read_text(encoding='utf-8'))
          version = (root / 'VERSION').read_text(encoding='utf-8').strip()
          current = lifecycle.get('currentStable')
          assert version == current == lifecycle.get('currentOfficial')
          current_release = next(item for item in lifecycle['releases'] if item.get('version') == current)
          assert current_release.get('status') == 'stable'
          assert current_release.get('consumerEligible') is True
          assert lifecycle.get('officialProductLabel') == current_release.get('label')

          retained = next(item for item in lifecycle['releases'] if item.get('version') == '1.2.0')
          assert retained.get('status') == 'stable'
          assert retained.get('consumerEligible') is True
          assert retained.get('stableBaseline') == '1.1.0'
          assert re.fullmatch(r'[0-9a-f]{40}', retained.get('sourceQualificationAnchor', ''))

          report = {
              'schemaVersion': 4,
              'status': 'pass',
              'repository': 'GoreeCloud/goreecloud-glaze-ui',
              'revision': os.environ['GLAZE_SOURCE_REVISION'],
              'liveCurrentStable': current,
              'retainedRelease': '1.2.0',
              'retainedStatus': retained.get('status'),
              'retainedSourceQualificationAnchor': retained.get('sourceQualificationAnchor'),
              'globalAuthorityMovedToV12': False,
              'v141PromotionImplied': False,
              'consumerConformanceImplied': False,
          }
          out = root / 'artifacts/glaze-v1.2-retained-stable-boundary.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('GLAZE UI V1.2 retained exact-revision boundary: PASS')
          PY

      - name: Upload retained-release integrity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.2-retained-integrity-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/glaze-v1.2-retained-stable-boundary.json
            artifacts/glaze-v1.2-retained-lifecycle-version-integrity.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

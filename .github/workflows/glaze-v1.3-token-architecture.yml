name: GLAZE UI V1.3 Token Architecture

on:
  push:
    branches:
      - feat/glaze-ui-v1.3-adaptive-resonance
    paths:
      - 'contracts/v1.3/adaptive-resonance.candidate.json'
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'tokens/glaze-v1.3-*.candidate.json'
      - 'scripts/validate_glaze_v1_3_token_architecture.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-token-architecture.yml'
  pull_request:
    paths:
      - 'contracts/v1.3/adaptive-resonance.candidate.json'
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'tokens/glaze-v1.3-*.candidate.json'
      - 'scripts/validate_glaze_v1_3_token_architecture.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-token-architecture.yml'

jobs:
  validate-v1-3-token-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile validators
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_phase0.py
          python -m py_compile scripts/validate_glaze_v1_3_token_architecture.py
      - name: Revalidate V1.2 Stable authority
        run: python scripts/validate_glaze_v1_2_stable.py
      - name: Revalidate V1.3 Phase 0 boundary
        run: python scripts/validate_glaze_v1_3_phase0.py
      - name: Validate V1.3 token architecture
        run: python scripts/validate_glaze_v1_3_token_architecture.py
      - name: Parse V1.3 architecture JSON
        run: |
          python -m json.tool contracts/v1.3/adaptive-resonance.plan.json >/dev/null
          python -m json.tool contracts/v1.3/adaptive-resonance.candidate.json >/dev/null
          python -m json.tool tokens/glaze-v1.3-color.candidate.json >/dev/null
          python -m json.tool tokens/glaze-v1.3-material.candidate.json >/dev/null
          python -m json.tool tokens/glaze-v1.3-shape.candidate.json >/dev/null
          python -m json.tool tokens/glaze-v1.3-type.candidate.json >/dev/null
          python -m json.tool tokens/glaze-v1.3-motion.candidate.json >/dev/null
          python -m json.tool tokens/glaze-v1.3-layout.candidate.json >/dev/null

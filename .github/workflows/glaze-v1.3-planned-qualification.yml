name: GLAZE UI V1.3 Planned Qualification Control Plane

on:
  pull_request:
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-deferred-qualification.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_3_planned.py"
      - ".github/workflows/glaze-v1.3-planned-qualification.yml"
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-deferred-qualification.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_3_planned.py"
      - ".github/workflows/glaze-v1.3-planned-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planned-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/validate_glaze_v1_3_planned.py
      - run: |
          test "$(cat VERSION)" = "1.2.0"
          python - <<'PY'
          import json
          lifecycle = json.load(open('registry/lifecycle.json', encoding='utf-8'))
          assert lifecycle['currentStable'] == '1.2.0'
          assert lifecycle['currentOfficial'] == '1.2.0'
          assert lifecycle['activeCandidate'] is None
          assert lifecycle['plannedNext'] == '1.3.0-candidate'
          print('V1.3 control plane is planned-only; no Candidate activation or qualification pass is implied.')
          PY

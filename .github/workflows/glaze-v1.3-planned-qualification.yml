name: GLAZE UI V1.3.1 Qualification Hardening Control Plane

on:
  pull_request:
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-stable.md"
      - "acceptance/v1.3.1-hardening.md"
      - "acceptance/v1.3-deferred-qualification.md"
      - "acceptance/v1.3-candidate.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "tests/glaze-v1.3-qualification.test.mjs"
      - "scripts/validate_glaze_v1_3_stable.py"
      - ".github/workflows/glaze-v1.3-planned-qualification.yml"
  push:
    branches:
      - main
      - release/v1.3.0
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-stable.md"
      - "acceptance/v1.3.1-hardening.md"
      - "acceptance/v1.3-deferred-qualification.md"
      - "acceptance/v1.3-candidate.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "tests/glaze-v1.3-qualification.test.mjs"
      - "scripts/validate_glaze_v1_3_stable.py"
      - ".github/workflows/glaze-v1.3-planned-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualification-hardening-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'Expected source revision: %s\nActual source revision:   %s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate current V1.3 Stable authority
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_stable.py
          python scripts/validate_glaze_v1_3_stable.py

      - name: Test retained fail-closed qualification quality gates
        run: node --test tests/glaze-v1.3-qualification.test.mjs

      - name: Preserve 55-rule quality authority and V1.3.1 handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lifecycle = json.load(open('registry/lifecycle.json', encoding='utf-8'))
          assert lifecycle['currentStable'] == '1.3.0'
          assert lifecycle['currentOfficial'] == '1.3.0'
          assert lifecycle['activeCandidate'] is None
          assert lifecycle['plannedNext'] == '1.3.1'
          quality = json.load(open('contracts/v1.3/quality-rules.candidate.json', encoding='utf-8'))
          assert len(quality['rules']) == 55
          assert quality['humanReviewRequired'] is True
          assert quality['automatedValidationSufficient'] is False
          hardening = Path('acceptance/v1.3.1-hardening.md').read_text(encoding='utf-8')
          for lane in ('H1', 'H2', 'H3', 'H4', 'H5', 'H6'):
              assert f'### {lane}' in hardening
          print('V1.3.0 remains Stable; missing qualification evidence remains fail-closed and is carried to V1.3.1 hardening.')
          PY

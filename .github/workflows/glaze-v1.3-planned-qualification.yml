name: GLAZE UI V1.3 Qualification Control Plane

on:
  pull_request:
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-deferred-qualification.md"
      - "acceptance/v1.3-candidate.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "tests/glaze-v1.3-qualification.test.mjs"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - "scripts/validate_glaze_v1_2_documentation_versions.py"
      - "scripts/validate_glaze_v1_3_planned.py"
      - "scripts/validate_glaze_v1_3_qualification.py"
      - ".github/workflows/glaze-v1.3-planned-qualification.yml"
  push:
    branches:
      - main
      - feat/glaze-ui-v1.3-adaptive-resonance
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-deferred-qualification.md"
      - "acceptance/v1.3-candidate.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "tests/glaze-v1.3-qualification.test.mjs"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - "scripts/validate_glaze_v1_2_documentation_versions.py"
      - "scripts/validate_glaze_v1_3_planned.py"
      - "scripts/validate_glaze_v1_3_qualification.py"
      - ".github/workflows/glaze-v1.3-planned-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualification-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'Expected source revision: %s\nActual source revision:   %s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile qualification validators
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_planned.py
          python -m py_compile scripts/validate_glaze_v1_2_documentation_versions.py

      - name: Validate qualification control plane and 55-rule quality authority
        run: python scripts/validate_glaze_v1_3_planned.py

      - name: Validate current lifecycle documentation integrity
        run: python scripts/validate_glaze_v1_2_documentation_versions.py

      - name: Test qualification readiness quality gates
        run: node --test tests/glaze-v1.3-qualification.test.mjs

      - name: Preserve pre-promotion lifecycle boundary
        run: |
          test "$(cat VERSION)" = "1.2.0"
          python - <<'PY'
          import json
          lifecycle = json.load(open('registry/lifecycle.json', encoding='utf-8'))
          assert lifecycle['currentStable'] == '1.2.0'
          assert lifecycle['currentOfficial'] == '1.2.0'
          assert lifecycle['activeCandidate'] is None
          assert lifecycle['plannedNext'] == '1.3.0-candidate'
          plan = json.load(open('contracts/v1.3/deferred-qualification.plan.json', encoding='utf-8'))
          quality = json.load(open('contracts/v1.3/quality-rules.candidate.json', encoding='utf-8'))
          assert plan['lifecycle'] in {'planned', 'qualification-active'}
          assert plan['qualityContract'] == 'contracts/v1.3/quality-rules.candidate.json'
          assert len(quality['rules']) == 55
          assert quality['humanReviewRequired'] is True
          assert quality['automatedValidationSufficient'] is False
          print('V1.3 qualification may collect fresh evidence; visual quality is human-gated and lifecycle promotion remains separate.')
          PY

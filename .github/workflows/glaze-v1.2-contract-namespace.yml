name: Glaze V1.2 Contract Namespace Candidate

on:
  pull_request:
    paths:
      - "contracts/v1.2/**"
      - "scripts/validate_glaze_v1_2_contract_namespace.py"
      - ".github/workflows/glaze-v1.2-contract-namespace.yml"
      - "VERSION"
      - "registry/lifecycle.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-2-contract-namespace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Preserve Stable and Candidate authorities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py

      - name: Validate semantic V1.2 Candidate contract namespaces
        run: |
          python scripts/validate_glaze_v1_2_contract_namespace.py \
            --output "artifacts/glaze-v1.2-contract-namespace-${{ github.event.pull_request.head.sha || github.sha }}.json"

      - name: Compile bounded contract-namespace validator
        run: python -m py_compile scripts/validate_glaze_v1_2_contract_namespace.py

      - name: Verify validator did not mutate tracked source
        run: git diff --exit-code

      - name: Upload exact-head contract-namespace evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glaze-v1.2-contract-namespace-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-v1.2-contract-namespace-${{ github.event.pull_request.head.sha || github.sha }}.json
          if-no-files-found: error
          retention-days: 14

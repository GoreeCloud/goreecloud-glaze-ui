name: GLAZE UI V1.3 Readiness and V1.3.1 Hardening Control Plane

on:
  pull_request:
    paths:
      - "contracts/v1.3/**"
      - "acceptance/v1.3-stable.md"
      - "acceptance/v1.3.1-hardening.md"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "js/glaze-v1.3-stable-readiness.candidate.mjs"
      - "js/glaze-v1.3.0.mjs"
      - "scripts/evaluate_glaze_v1_3_stable_readiness.mjs"
      - "scripts/validate_glaze_v1_3_stable_readiness.py"
      - "scripts/validate_glaze_v1_3_stable.py"
      - "tests/glaze-v1.3-stable-readiness.test.mjs"
      - "registry/lifecycle.json"
      - "VERSION"
      - ".github/workflows/glaze-v1.3-stable-readiness.yml"
  push:
    branches: [main, release/v1.3.0]
    paths:
      - "contracts/v1.3/**"
      - "acceptance/v1.3-stable.md"
      - "acceptance/v1.3.1-hardening.md"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "js/glaze-v1.3-stable-readiness.candidate.mjs"
      - "js/glaze-v1.3.0.mjs"
      - "scripts/evaluate_glaze_v1_3_stable_readiness.mjs"
      - "scripts/validate_glaze_v1_3_stable_readiness.py"
      - "scripts/validate_glaze_v1_3_stable.py"
      - "tests/glaze-v1.3-stable-readiness.test.mjs"
      - "registry/lifecycle.json"
      - "VERSION"
      - ".github/workflows/glaze-v1.3-stable-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-and-hardening-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile lifecycle and historical readiness validators
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_stable_readiness.py
          python -m py_compile scripts/validate_glaze_v1_3_stable.py
      - name: Validate lifecycle-appropriate authority
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [ "$version" = "1.3.0" ]; then
            python scripts/validate_glaze_v1_3_stable.py
          else
            python scripts/validate_glaze_v1_3_stable_readiness.py
          fi
      - name: Check readiness evaluator and CLI syntax
        run: |
          node --check js/glaze-v1.3-stable-readiness.candidate.mjs
          node --check scripts/evaluate_glaze_v1_3_stable_readiness.mjs
          node --check js/glaze-v1.3.0.mjs
      - name: Test historical staged Stable-readiness mechanism
        run: node --test tests/glaze-v1.3-stable-readiness.test.mjs
      - name: Prove missing evidence remains fail-closed for V1.3.1 hardening
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/glaze-v1.3-empty-evidence
          set +e
          node scripts/evaluate_glaze_v1_3_stable_readiness.mjs \
            --candidate-source-revision "$HEAD_SHA" \
            --stable-source-revision "$HEAD_SHA" \
            --evidence-dir /tmp/glaze-v1.3-empty-evidence \
            --require-ready > /tmp/glaze-v1.3-stable-readiness.json
          status=$?
          set -e
          test "$status" = "2"
          python - <<'PY'
          import json
          result=json.load(open('/tmp/glaze-v1.3-stable-readiness.json',encoding='utf-8'))['result']
          assert result['state']=='blocked'
          assert result['stableGateSatisfied'] is False
          assert result['lifecyclePromotionGranted'] is False
          assert result['stablePromoted'] is False
          assert result['consumerConformanceGranted'] is False
          print('Missing historical qualification evidence remains fail-closed and is not converted into a pass by V1.3.0 promotion.')
          PY

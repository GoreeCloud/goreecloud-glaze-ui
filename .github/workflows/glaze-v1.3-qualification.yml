name: GLAZE UI V1.3 Qualification Evidence and V1.3.1 Hardening

on:
  pull_request:
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-stable.md"
      - "acceptance/v1.3.1-hardening.md"
      - "acceptance/v1.3-candidate.md"
      - "acceptance/v1.3-deferred-qualification.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "tests/glaze-v1.3-qualification.test.mjs"
      - "tests/glaze-v1.3-qualification-cli.test.mjs"
      - "scripts/evaluate_glaze_v1_3_qualification.mjs"
      - "scripts/audit_glaze_v1_3_namespace.py"
      - "scripts/prepare_glaze_v1_3_qualification_record.py"
      - "scripts/test_prepare_glaze_v1_3_qualification_record.py"
      - "scripts/validate_glaze_v1_3_stable.py"
      - ".github/workflows/glaze-v1.3-qualification.yml"
  push:
    branches:
      - main
      - release/v1.3.0
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-stable.md"
      - "acceptance/v1.3.1-hardening.md"
      - "acceptance/v1.3-candidate.md"
      - "acceptance/v1.3-deferred-qualification.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "tests/glaze-v1.3-qualification.test.mjs"
      - "tests/glaze-v1.3-qualification-cli.test.mjs"
      - "scripts/evaluate_glaze_v1_3_qualification.mjs"
      - "scripts/audit_glaze_v1_3_namespace.py"
      - "scripts/prepare_glaze_v1_3_qualification_record.py"
      - "scripts/test_prepare_glaze_v1_3_qualification_record.py"
      - "scripts/validate_glaze_v1_3_stable.py"
      - ".github/workflows/glaze-v1.3-qualification.yml"
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Exact source SHA to evaluate for qualification evidence; defaults to checked-out SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-v1-3-qualification-and-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'Expected source revision: %s\nActual source revision:   %s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile Stable and qualification tooling
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_stable.py
          python -m py_compile scripts/audit_glaze_v1_3_namespace.py
          python -m py_compile scripts/prepare_glaze_v1_3_qualification_record.py
          python -m py_compile scripts/test_prepare_glaze_v1_3_qualification_record.py

      - name: Validate current V1.3 Stable authority
        run: python scripts/validate_glaze_v1_3_stable.py

      - name: Test fail-closed qualification draft preparation
        run: python scripts/test_prepare_glaze_v1_3_qualification_record.py

      - name: Prove prepared drafts cannot satisfy qualification
        env:
          CHECKED_OUT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/prepare_glaze_v1_3_qualification_record.py physical-device \
            --operator "CI Draft Sentinel" \
            --source-revision "$CHECKED_OUT_SOURCE_REVISION" \
            --output artifacts/v1.3/qualification-drafts/ci-physical-device.json
          mkdir -p /tmp/glaze-v1.3-draft-evidence
          cp artifacts/v1.3/qualification-drafts/ci-physical-device.json /tmp/glaze-v1.3-draft-evidence/
          node scripts/evaluate_glaze_v1_3_qualification.mjs \
            --source-revision "$CHECKED_OUT_SOURCE_REVISION" \
            --evidence-dir /tmp/glaze-v1.3-draft-evidence \
            > /tmp/glaze-v1.3-draft-readiness.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/glaze-v1.3-draft-readiness.json', encoding='utf-8'))['result']
          assert result['state'] == 'blocked'
          assert result['qualificationGateSatisfied'] is False
          assert result['acceptedWorkstreamCount'] == 0
          assert result['lifecyclePromotionGranted'] is False
          assert result['candidateActivated'] is False
          assert result['consumerEligibilityGranted'] is False
          assert result['consumerConformanceGranted'] is False
          print('Prepared draft remains fail-closed and contributes 0 accepted qualification workstreams.')
          PY

      - name: Check qualification runtime and evidence CLI syntax
        run: |
          node --check js/glaze-v1.3-qualification.candidate.mjs
          node --check scripts/evaluate_glaze_v1_3_qualification.mjs

      - name: Test qualification readiness evaluator and evidence CLI
        run: node --test tests/glaze-v1.3-qualification.test.mjs tests/glaze-v1.3-qualification-cli.test.mjs

      - name: Audit real historical qualification evidence without granting lifecycle state
        env:
          REQUESTED_SOURCE_REVISION: ${{ inputs.source_revision }}
          CHECKED_OUT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SOURCE_REVISION="${REQUESTED_SOURCE_REVISION:-$CHECKED_OUT_SOURCE_REVISION}"
          node scripts/evaluate_glaze_v1_3_qualification.mjs \
            --source-revision "$SOURCE_REVISION" \
            --evidence-dir evidence/v1.3 \
            > /tmp/glaze-v1.3-qualification-readiness.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/glaze-v1.3-qualification-readiness.json', encoding='utf-8'))['result']
          assert result['state'] in {'blocked', 'ready-for-governed-candidate-promotion-review'}
          assert result['lifecyclePromotionGranted'] is False
          assert result['candidateActivated'] is False
          assert result['consumerEligibilityGranted'] is False
          assert result['consumerConformanceGranted'] is False
          print(f"Historical evidence readiness: {result['state']} ({result['acceptedWorkstreamCount']}/{result['requiredWorkstreamCount']}); current Stable authority is validated separately.")
          PY

      - name: Audit retained Candidate source namespace
        run: |
          python scripts/audit_glaze_v1_3_namespace.py --output /tmp/glaze-v1.3-namespace.json
          python - <<'PY'
          import json
          audit = json.load(open('/tmp/glaze-v1.3-namespace.json', encoding='utf-8'))
          assert audit['lifecycleAuthority'] is False
          assert audit['qualificationEffect'] == 'inventory-only-no-pass'
          assert audit['officialCandidateEntrypoints']['css']['exists'] is False
          assert audit['officialCandidateEntrypoints']['runtime']['exists'] is False
          print(f"Historical Candidate-named source paths inventoried: {audit['counts']['candidateNamedPaths']}")
          PY

      - name: Assert current Stable plus V1.3.1 hardening boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lifecycle = json.load(open('registry/lifecycle.json', encoding='utf-8'))
          assert lifecycle['currentStable'] == '1.3.0'
          assert lifecycle['currentOfficial'] == '1.3.0'
          assert lifecycle['activeCandidate'] is None
          assert lifecycle['plannedNext'] == '1.3.1'
          quality = json.load(open('contracts/v1.3/quality-rules.candidate.json', encoding='utf-8'))
          assert len(quality['rules']) == 55
          assert quality['humanReviewRequired'] is True
          assert quality['automatedValidationSufficient'] is False
          hardening = Path('acceptance/v1.3.1-hardening.md').read_text(encoding='utf-8')
          for lane in ('H1', 'H2', 'H3', 'H4', 'H5', 'H6'):
              assert f'### {lane}' in hardening
          print('V1.3.0 is Stable; unresolved qualification remains explicit V1.3.1 hardening rather than retroactive passing evidence.')
          PY

name: GLAZE UI V1.3 Fresh Qualification and Candidate Readiness

on:
  pull_request:
    paths:
      - "GLAZE_UI_V1_3_CANDIDATE.md"
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-candidate.md"
      - "acceptance/v1.3-deferred-qualification.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "tests/glaze-v1.3-qualification.test.mjs"
      - "tests/glaze-v1.3-qualification-cli.test.mjs"
      - "scripts/evaluate_glaze_v1_3_qualification.mjs"
      - "scripts/audit_glaze_v1_3_namespace.py"
      - "scripts/prepare_glaze_v1_3_qualification_record.py"
      - "scripts/test_prepare_glaze_v1_3_qualification_record.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - "scripts/validate_glaze_v1_2_documentation_versions.py"
      - "scripts/validate_glaze_v1_3_phase0.py"
      - "scripts/validate_glaze_v1_3_migration.py"
      - "scripts/validate_glaze_v1_3_planned.py"
      - "scripts/validate_glaze_v1_3_qualification.py"
      - ".github/workflows/glaze-v1.3-qualification.yml"
      - ".github/workflows/glaze-v1.3-planned-qualification.yml"
  push:
    branches:
      - main
      - feat/glaze-ui-v1.3-adaptive-resonance
    paths:
      - "GLAZE_UI_V1_3_CANDIDATE.md"
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-candidate.md"
      - "acceptance/v1.3-deferred-qualification.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "tests/glaze-v1.3-qualification.test.mjs"
      - "tests/glaze-v1.3-qualification-cli.test.mjs"
      - "scripts/evaluate_glaze_v1_3_qualification.mjs"
      - "scripts/audit_glaze_v1_3_namespace.py"
      - "scripts/prepare_glaze_v1_3_qualification_record.py"
      - "scripts/test_prepare_glaze_v1_3_qualification_record.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - "scripts/validate_glaze_v1_2_documentation_versions.py"
      - "scripts/validate_glaze_v1_3_phase0.py"
      - "scripts/validate_glaze_v1_3_migration.py"
      - "scripts/validate_glaze_v1_3_planned.py"
      - "scripts/validate_glaze_v1_3_qualification.py"
      - ".github/workflows/glaze-v1.3-qualification.yml"
      - ".github/workflows/glaze-v1.3-planned-qualification.yml"
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Frozen follow-up qualification SHA to evaluate; defaults to the checked-out SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-v1-3-fresh-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'Expected source revision: %s\nActual source revision:   %s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile V1.3 qualification validators and draft tooling
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_phase0.py
          python -m py_compile scripts/validate_glaze_v1_3_migration.py
          python -m py_compile scripts/validate_glaze_v1_3_planned.py
          python -m py_compile scripts/validate_glaze_v1_3_qualification.py
          python -m py_compile scripts/validate_glaze_v1_2_documentation_versions.py
          python -m py_compile scripts/audit_glaze_v1_3_namespace.py
          python -m py_compile scripts/prepare_glaze_v1_3_qualification_record.py
          python -m py_compile scripts/test_prepare_glaze_v1_3_qualification_record.py

      - name: Test fail-closed qualification draft preparation
        run: python scripts/test_prepare_glaze_v1_3_qualification_record.py

      - name: Prove prepared drafts cannot satisfy qualification
        env:
          CHECKED_OUT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/prepare_glaze_v1_3_qualification_record.py physical-device \
            --operator "CI Draft Sentinel" \
            --source-revision "$CHECKED_OUT_SOURCE_REVISION" \
            --output artifacts/v1.3/qualification-drafts/ci-physical-device.json
          mkdir -p /tmp/glaze-v1.3-draft-evidence
          cp artifacts/v1.3/qualification-drafts/ci-physical-device.json /tmp/glaze-v1.3-draft-evidence/
          node scripts/evaluate_glaze_v1_3_qualification.mjs \
            --source-revision "$CHECKED_OUT_SOURCE_REVISION" \
            --evidence-dir /tmp/glaze-v1.3-draft-evidence \
            > /tmp/glaze-v1.3-draft-readiness.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/glaze-v1.3-draft-readiness.json', encoding='utf-8'))['result']
          assert result['state'] == 'blocked'
          assert result['qualificationGateSatisfied'] is False
          assert result['acceptedWorkstreamCount'] == 0
          assert result['lifecyclePromotionGranted'] is False
          assert result['candidateActivated'] is False
          assert result['consumerEligibilityGranted'] is False
          assert result['consumerConformanceGranted'] is False
          assert any('physical-device-native-platform-qualification' in blocker and 'status is not passed' in blocker for blocker in result['blockers'])
          print('Prepared draft remains fail-closed and contributes 0 accepted qualification workstreams.')
          PY

      - name: Preserve retained V1.2 rollback authority
        run: python scripts/validate_glaze_v1_2_stable.py

      - name: Validate current lifecycle documentation integrity
        run: python scripts/validate_glaze_v1_2_documentation_versions.py

      - name: Preserve V1.3 Stable and deferred-evidence boundary
        run: python scripts/validate_glaze_v1_3_phase0.py

      - name: Revalidate Migration and Consumer Boundary dependency
        run: python scripts/validate_glaze_v1_3_migration.py

      - name: Validate active qualification control plane and 55-rule visual-quality authority
        run: python scripts/validate_glaze_v1_3_planned.py

      - name: Validate V1.3 fresh qualification mechanism
        run: python scripts/validate_glaze_v1_3_qualification.py

      - name: Check qualification runtime and evidence CLI syntax
        run: |
          node --check js/glaze-v1.3-qualification.candidate.mjs
          node --check scripts/evaluate_glaze_v1_3_qualification.mjs

      - name: Test qualification readiness evaluator and evidence CLI
        run: node --test tests/glaze-v1.3-qualification.test.mjs tests/glaze-v1.3-qualification-cli.test.mjs

      - name: Audit real qualification evidence against selected source revision
        env:
          REQUESTED_SOURCE_REVISION: ${{ inputs.source_revision }}
          CHECKED_OUT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SOURCE_REVISION="${REQUESTED_SOURCE_REVISION:-$CHECKED_OUT_SOURCE_REVISION}"
          node scripts/evaluate_glaze_v1_3_qualification.mjs \
            --source-revision "$SOURCE_REVISION" \
            --evidence-dir evidence/v1.3 \
            > /tmp/glaze-v1.3-qualification-readiness.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/glaze-v1.3-qualification-readiness.json', encoding='utf-8'))['result']
          assert result['state'] in {'blocked', 'ready-for-governed-candidate-promotion-review'}
          assert result['lifecyclePromotionGranted'] is False
          assert result['candidateActivated'] is False
          assert result['consumerEligibilityGranted'] is False
          assert result['consumerConformanceGranted'] is False
          print(f"Evidence readiness: {result['state']} ({result['acceptedWorkstreamCount']}/{result['requiredWorkstreamCount']})")
          PY

      - name: Audit retained V1.3 candidate-named source namespace
        run: |
          python scripts/audit_glaze_v1_3_namespace.py --output /tmp/glaze-v1.3-namespace.json
          python - <<'PY'
          import json
          audit = json.load(open('/tmp/glaze-v1.3-namespace.json', encoding='utf-8'))
          assert audit['lifecycleAuthority'] is False
          assert audit['qualificationEffect'] == 'inventory-only-no-pass'
          assert audit['officialCandidateEntrypoints']['css']['exists'] is False
          assert audit['officialCandidateEntrypoints']['runtime']['exists'] is False
          print(f"Candidate-named source paths inventoried: {audit['counts']['candidateNamedPaths']}")
          PY

      - name: Parse qualification JSON authorities
        run: |
          python - <<'PY'
          import json
          paths = [
              'contracts/v1.3/adaptive-resonance.plan.json',
              'contracts/v1.3/deferred-qualification.plan.json',
              'contracts/v1.3/qualification-matrix.json',
              'contracts/v1.3/qualification-evidence.schema.json',
              'contracts/v1.3/qualification-readiness.candidate.json',
              'contracts/v1.3/quality-rules.candidate.json',
          ]
          for path in paths:
              with open(path, encoding='utf-8') as handle:
                  json.load(handle)
          quality = json.load(open('contracts/v1.3/quality-rules.candidate.json', encoding='utf-8'))
          assert len(quality['rules']) == 55
          assert quality['humanReviewRequired'] is True
          assert quality['automatedValidationSufficient'] is False
          print('Qualification JSON authorities parse successfully; 55-rule visual-quality authority is present.')
          PY

      - name: Assert current Stable remains active and follow-up cannot self-promote
        run: |
          python - <<'PY'
          import json
          lifecycle = json.load(open('registry/lifecycle.json', encoding='utf-8'))
          assert lifecycle['currentStable'] == '1.3.0'
          assert lifecycle['currentOfficial'] == '1.3.0'
          assert lifecycle['activeCandidate'] is None
          assert lifecycle['plannedNext'] == '1.3.1-candidate'
          plan = json.load(open('contracts/v1.3/deferred-qualification.plan.json', encoding='utf-8'))
          assert plan['sourceStable'] == '1.3.0'
          assert plan['targetVersion'] == '1.3.1-candidate'
          assert plan['rules']['v1.3.1LifecyclePromotionAutomatic'] is False
          print('V1.3.0 remains current Stable; V1.3.1 follow-up readiness is not lifecycle promotion.')
          PY

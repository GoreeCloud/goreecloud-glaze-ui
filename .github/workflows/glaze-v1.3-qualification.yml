name: GLAZE UI V1.3 Fresh Qualification and Candidate Readiness

on:
  pull_request:
    paths:
      - "GLAZE_UI_V1_3_CANDIDATE.md"
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-candidate.md"
      - "acceptance/v1.3-deferred-qualification.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "tests/glaze-v1.3-qualification.test.mjs"
      - "scripts/validate_glaze_v1_3_phase0.py"
      - "scripts/validate_glaze_v1_3_migration.py"
      - "scripts/validate_glaze_v1_3_planned.py"
      - "scripts/validate_glaze_v1_3_qualification.py"
      - ".github/workflows/glaze-v1.3-qualification.yml"
      - ".github/workflows/glaze-v1.3-planned-qualification.yml"
  push:
    branches: [main]
    paths:
      - "GLAZE_UI_V1_3_CANDIDATE.md"
      - "VERSION"
      - "registry/lifecycle.json"
      - "acceptance/v1.3-candidate.md"
      - "acceptance/v1.3-deferred-qualification.md"
      - "contracts/v1.3/**"
      - "evidence/v1.3/**"
      - "js/glaze-v1.3-qualification.candidate.mjs"
      - "tests/glaze-v1.3-qualification.test.mjs"
      - "scripts/validate_glaze_v1_3_phase0.py"
      - "scripts/validate_glaze_v1_3_migration.py"
      - "scripts/validate_glaze_v1_3_planned.py"
      - "scripts/validate_glaze_v1_3_qualification.py"
      - ".github/workflows/glaze-v1.3-qualification.yml"
      - ".github/workflows/glaze-v1.3-planned-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-v1-3-fresh-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile V1.3 qualification validators
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_phase0.py
          python -m py_compile scripts/validate_glaze_v1_3_migration.py
          python -m py_compile scripts/validate_glaze_v1_3_planned.py
          python -m py_compile scripts/validate_glaze_v1_3_qualification.py
      - name: Preserve V1.2 Stable authority
        run: python scripts/validate_glaze_v1_2_stable.py
      - name: Preserve V1.3 pre-promotion boundary
        run: python scripts/validate_glaze_v1_3_phase0.py
      - name: Revalidate Migration and Consumer Boundary dependency
        run: python scripts/validate_glaze_v1_3_migration.py
      - name: Validate active qualification control plane
        run: python scripts/validate_glaze_v1_3_planned.py
      - name: Validate V1.3 fresh qualification mechanism
        run: python scripts/validate_glaze_v1_3_qualification.py
      - name: Check qualification readiness runtime syntax
        run: node --check js/glaze-v1.3-qualification.candidate.mjs
      - name: Test qualification readiness evaluator
        run: node --test tests/glaze-v1.3-qualification.test.mjs
      - name: Parse qualification JSON authorities
        run: |
          python - <<'PY'
          import json
          paths = [
              'contracts/v1.3/adaptive-resonance.plan.json',
              'contracts/v1.3/deferred-qualification.plan.json',
              'contracts/v1.3/qualification-matrix.json',
              'contracts/v1.3/qualification-evidence.schema.json',
              'contracts/v1.3/qualification-readiness.candidate.json',
          ]
          for path in paths:
              with open(path, encoding='utf-8') as handle:
                  json.load(handle)
          print('Qualification JSON authorities parse successfully.')
          PY
      - name: Assert Candidate remains inactive
        run: |
          python - <<'PY'
          import json
          lifecycle = json.load(open('registry/lifecycle.json', encoding='utf-8'))
          assert lifecycle['currentStable'] == '1.2.0'
          assert lifecycle['currentOfficial'] == '1.2.0'
          assert lifecycle['activeCandidate'] is None
          assert lifecycle['plannedNext'] == '1.3.0-candidate'
          print('Candidate remains inactive; qualification readiness is not lifecycle promotion.')
          PY

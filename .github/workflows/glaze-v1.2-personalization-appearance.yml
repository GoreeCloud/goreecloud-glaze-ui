name: Glaze V1.2 Personalization and Appearance Candidate

on:
  pull_request:
    paths:
      - "contracts/v1.2/personalization-appearance.candidate.json"
      - "css/glaze-v1.2-personalization-appearance.candidate.css"
      - "js/glaze-v1.2-personalization.candidate.mjs"
      - "css/glaze-v1.2.0-candidate.css"
      - "reference/v1.2/personalization-appearance.html"
      - "scripts/validate_glaze_v1_2_personalization_appearance_rendered.py"
      - ".github/workflows/glaze-v1.2-personalization-appearance.yml"
      - "contracts/v1.2/accessibility-adaptation.candidate.json"
      - "contracts/v1.2/living-glaze.candidate.json"
      - "tokens/glaze-v1.2-form-factor.candidate.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-2-personalization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  personalization-appearance-rendered:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Preserve Stable and Candidate authorities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py
          python scripts/validate_glaze_v1_2_core_tokens.py
          python scripts/validate_glaze_v1_2_form_factor_tokens.py

      - name: Validate rendered V1.2 Personalization and Appearance behavior
        run: python scripts/validate_glaze_v1_2_personalization_appearance_rendered.py

      - name: Upload V1.2 Personalization and Appearance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glaze-v1.2-personalization-appearance-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-v1.2-personalization-appearance-*.png
          if-no-files-found: error
          retention-days: 14

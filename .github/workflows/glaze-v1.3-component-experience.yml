name: GLAZE UI V1.3 Signature Components and Reference Suite

on:
  push:
    branches:
      - feat/glaze-ui-v1.3-adaptive-resonance
    paths:
      - 'contracts/components/v1/catalog.json'
      - 'contracts/v1.2/component-experience.candidate.json'
      - 'contracts/v1.2/signature-components.candidate.json'
      - 'contracts/v1.2/composition-reference-library.candidate.json'
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'contracts/v1.3/component-experience.candidate.json'
      - 'contracts/v1.3/system-shell.candidate.json'
      - 'contracts/v1.3/multi-pane.candidate.json'
      - 'contracts/v1.3/personalization.candidate.json'
      - 'contracts/v1.3/accessibility.candidate.json'
      - 'js/glaze-v1.3-component-experience.candidate.mjs'
      - 'js/glaze-v1.3-system-shell.candidate.mjs'
      - 'js/glaze-v1.3-multi-pane.candidate.mjs'
      - 'js/glaze-v1.3-personalization.candidate.mjs'
      - 'tests/glaze-v1.3-component-experience.test.mjs'
      - 'tests/glaze-v1.3-personalization.test.mjs'
      - 'scripts/validate_glaze_v1_3_component_experience.py'
      - 'scripts/validate_glaze_v1_3_system_shell.py'
      - 'scripts/validate_glaze_v1_3_multi_pane.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'reference/v1.3/**'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-component-experience.yml'
  pull_request:
    paths:
      - 'contracts/components/v1/catalog.json'
      - 'contracts/v1.2/component-experience.candidate.json'
      - 'contracts/v1.2/signature-components.candidate.json'
      - 'contracts/v1.2/composition-reference-library.candidate.json'
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'contracts/v1.3/component-experience.candidate.json'
      - 'contracts/v1.3/system-shell.candidate.json'
      - 'contracts/v1.3/multi-pane.candidate.json'
      - 'contracts/v1.3/personalization.candidate.json'
      - 'contracts/v1.3/accessibility.candidate.json'
      - 'js/glaze-v1.3-component-experience.candidate.mjs'
      - 'js/glaze-v1.3-system-shell.candidate.mjs'
      - 'js/glaze-v1.3-multi-pane.candidate.mjs'
      - 'js/glaze-v1.3-personalization.candidate.mjs'
      - 'tests/glaze-v1.3-component-experience.test.mjs'
      - 'tests/glaze-v1.3-personalization.test.mjs'
      - 'scripts/validate_glaze_v1_3_component_experience.py'
      - 'scripts/validate_glaze_v1_3_system_shell.py'
      - 'scripts/validate_glaze_v1_3_multi_pane.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'reference/v1.3/**'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-component-experience.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-v1-3-component-experience:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile V1.3 validators
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_phase0.py
          python -m py_compile scripts/validate_glaze_v1_3_system_shell.py
          python -m py_compile scripts/validate_glaze_v1_3_multi_pane.py
          python -m py_compile scripts/validate_glaze_v1_3_component_experience.py
      - name: Preserve V1.2 Stable authority
        run: python scripts/validate_glaze_v1_2_stable.py
      - name: Preserve V1.3 pre-promotion boundary
        run: python scripts/validate_glaze_v1_3_phase0.py
      - name: Revalidate System Shell dependency
        run: python scripts/validate_glaze_v1_3_system_shell.py
      - name: Revalidate Multi-Pane dependency
        run: python scripts/validate_glaze_v1_3_multi_pane.py
      - name: Reexercise Personalization dependency runtime
        run: |
          node --check js/glaze-v1.3-personalization.candidate.mjs
          node --test tests/glaze-v1.3-personalization.test.mjs
          python -m json.tool contracts/v1.3/personalization.candidate.json >/dev/null
      - name: Validate V1.3 Signature Components and Reference Suite
        run: python scripts/validate_glaze_v1_3_component_experience.py
      - name: Guard human-optical reference spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('reference/v1.3/signature-components-and-compositions.html').read_text(encoding='utf-8')
          required = {
              'card layout gap': '.reference-card,.reference-scene{padding:20px;border:1px solid currentColor;border-radius:20px;min-inline-size:0;display:grid;align-content:start;gap:12px}',
              'normalized child margins': '.reference-card>*,.reference-scene>*{margin:0;min-inline-size:0}',
              'navigation spacing': '.reference-card nav{display:flex;flex-wrap:wrap;gap:8px}',
              'output block separation': 'output{display:block;line-height:1.45;overflow-wrap:normal;word-break:normal;hyphens:none}',
          }
          missing = [name for name, fragment in required.items() if fragment not in html]
          if missing:
              raise SystemExit('reference optical spacing guard failed: ' + ', '.join(missing))
          print('reference optical spacing guard: PASS')
          PY
      - name: Check component resolver syntax
        run: node --check js/glaze-v1.3-component-experience.candidate.mjs
      - name: Test component and reference resolver
        run: node --test tests/glaze-v1.3-component-experience.test.mjs
      - name: Parse Phase 14 JSON
        run: |
          python -m json.tool contracts/v1.3/component-experience.candidate.json >/dev/null
          python -m json.tool reference/v1.3/signature-components-and-compositions.json >/dev/null
          python -m json.tool contracts/v1.3/adaptive-resonance.plan.json >/dev/null

name: Glaze V1.2 Living Glaze Candidate
on:
  push:
  pull_request:
jobs:
  living-glaze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Preserve Stable baseline
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py
          python scripts/validate_glaze_v1_2_contract_namespace.py
      - name: Validate Living Frosted Candidate contracts
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          python scripts/validate_glaze_v1_2_living_glaze.py 2>&1 | tee artifacts/glaze-v1.2-living-glaze-source.log
      - name: Validate rendered Living Frosted behavior
        run: python scripts/validate_glaze_v1_2_living_glaze_rendered.py
      - name: Upload Living Frosted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.2-living-glaze-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-v1.2-living-glaze-*
          if-no-files-found: error
          retention-days: 30

name: Glaze V1.2 Lifecycle and Documentation Version Integrity Candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-2-lifecycle-version-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-version-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Preserve Stable and Candidate authorities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py

      - name: Audit lifecycle and version integrity across tracked text sources
        run: |
          python scripts/validate_glaze_v1_2_documentation_versions.py \
            --output "artifacts/glaze-v1.2-lifecycle-version-integrity-${{ github.event.pull_request.head.sha || github.sha }}.json"

      - name: Compile lifecycle-version validator
        run: python -m py_compile scripts/validate_glaze_v1_2_documentation_versions.py

      - name: Verify validator did not mutate tracked source
        run: git diff --exit-code

      - name: Upload exact-head lifecycle-version evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.2-lifecycle-version-integrity-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-v1.2-lifecycle-version-integrity-${{ github.event.pull_request.head.sha || github.sha }}.json
          if-no-files-found: error
          retention-days: 14

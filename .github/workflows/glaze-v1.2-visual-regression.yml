name: Glaze V1.2 Provisional Visual Regression Candidate

on:
  pull_request:
    paths:
      - "css/**"
      - "js/**"
      - "tokens/**"
      - "reference/v1.2/**"
      - "contracts/v1.2/**"
      - "contracts/regression/visual-baselines-v1.json"
      - "contracts/regression/reference-invariants.json"
      - "scripts/glaze_v1_2_visual_regression.py"
      - "scripts/validate_glaze_v1_2_visual_regression.py"
      - ".github/workflows/glaze-v1.2-visual-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-2-visual-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provisional-visual-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out provisional reference revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a20ff9dacab9a83bfc58473a0b124f61f47af7c5
          path: _visual-reference
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Preserve Stable and Candidate authorities
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C _visual-reference rev-parse HEAD)" = "a20ff9dacab9a83bfc58473a0b124f61f47af7c5"
          python scripts/validate_glaze_v1.py
          python scripts/validate_glaze_v1_2_candidate.py
          python scripts/validate_glaze_v1_2_reference_scene_index.py

      - name: Validate visual regression governance and harness
        run: |
          python -m py_compile scripts/glaze_v1_2_visual_regression.py scripts/validate_glaze_v1_2_visual_regression.py
          python scripts/validate_glaze_v1_2_visual_regression.py

      - name: Capture provisional reference scenes
        run: >-
          python scripts/glaze_v1_2_visual_regression.py capture
          --root _visual-reference
          --out artifacts/visual-regression/reference

      - name: Capture exact-head scenes
        run: >-
          python scripts/glaze_v1_2_visual_regression.py capture
          --root .
          --out artifacts/visual-regression/current

      - name: Compare stabilized decoded pixels
        run: >-
          python scripts/glaze_v1_2_visual_regression.py compare
          --baseline artifacts/visual-regression/reference
          --current artifacts/visual-regression/current
          --baseline-root _visual-reference
          --current-root .
          --evidence artifacts/visual-regression/evidence.json

      - name: Upload paired visual regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glaze-v1.2-provisional-visual-regression-${{ github.run_id }}
          path: artifacts/visual-regression/
          if-no-files-found: error
          retention-days: 14

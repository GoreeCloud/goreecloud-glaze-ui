name: GLAZE UI V1.3 Personalization

on:
  push:
    branches:
      - feat/glaze-ui-v1.3-adaptive-resonance
    paths:
      - 'contracts/v1.2/personalization-appearance.candidate.json'
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'contracts/v1.3/personalization.candidate.json'
      - 'contracts/v1.3/dynamic-color.candidate.json'
      - 'contracts/v1.3/expressive-shape.candidate.json'
      - 'contracts/v1.3/typography.candidate.json'
      - 'contracts/v1.3/accessibility.candidate.json'
      - 'js/glaze-v1.3-personalization.candidate.mjs'
      - 'js/glaze-v1.3-dynamic-color.candidate.mjs'
      - 'js/glaze-v1.3-accessibility.candidate.mjs'
      - 'tests/glaze-v1.3-personalization.test.mjs'
      - 'scripts/validate_glaze_v1_3_personalization.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-personalization.yml'
  pull_request:
    paths:
      - 'contracts/v1.2/personalization-appearance.candidate.json'
      - 'contracts/v1.3/adaptive-resonance.plan.json'
      - 'contracts/v1.3/personalization.candidate.json'
      - 'contracts/v1.3/dynamic-color.candidate.json'
      - 'contracts/v1.3/expressive-shape.candidate.json'
      - 'contracts/v1.3/typography.candidate.json'
      - 'contracts/v1.3/accessibility.candidate.json'
      - 'js/glaze-v1.3-personalization.candidate.mjs'
      - 'js/glaze-v1.3-dynamic-color.candidate.mjs'
      - 'js/glaze-v1.3-accessibility.candidate.mjs'
      - 'tests/glaze-v1.3-personalization.test.mjs'
      - 'scripts/validate_glaze_v1_3_personalization.py'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - 'VERSION'
      - '.github/workflows/glaze-v1.3-personalization.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-v1-3-personalization:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile V1.3 validators
        run: |
          python -m py_compile scripts/validate_glaze_v1_3_phase0.py
          python -m py_compile scripts/validate_glaze_v1_3_dynamic_color.py
          python -m py_compile scripts/validate_glaze_v1_3_shape.py
          python -m py_compile scripts/validate_glaze_v1_3_typography.py
          python -m py_compile scripts/validate_glaze_v1_3_accessibility.py
          python -m py_compile scripts/validate_glaze_v1_3_personalization.py
      - name: Preserve V1.2 Stable authority
        run: python scripts/validate_glaze_v1_2_stable.py
      - name: Preserve V1.3 pre-promotion boundary
        run: python scripts/validate_glaze_v1_3_phase0.py
      - name: Revalidate Dynamic Color dependency
        run: python scripts/validate_glaze_v1_3_dynamic_color.py
      - name: Revalidate Expressive Shape dependency
        run: python scripts/validate_glaze_v1_3_shape.py
      - name: Revalidate Responsive Typography dependency
        run: python scripts/validate_glaze_v1_3_typography.py
      - name: Revalidate Accessibility and Resilience dependency
        run: python scripts/validate_glaze_v1_3_accessibility.py
      - name: Validate V1.3 Personalization
        run: python scripts/validate_glaze_v1_3_personalization.py
      - name: Check Personalization runtime syntax
        run: node --check js/glaze-v1.3-personalization.candidate.mjs
      - name: Test Personalization runtime
        run: node --test tests/glaze-v1.3-personalization.test.mjs
      - name: Parse Personalization JSON
        run: |
          python -m json.tool contracts/v1.3/personalization.candidate.json >/dev/null
          python -m json.tool contracts/v1.3/adaptive-resonance.plan.json >/dev/null

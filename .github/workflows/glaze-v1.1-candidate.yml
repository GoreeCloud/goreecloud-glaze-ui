name: Glaze V1.1 Candidate

on:
  pull_request:
    paths:
      - 'GLAZE_UI_V1_1_CANDIDATE.md'
      - 'contracts/v1.1/**'
      - 'tokens/glaze-v1.1-*.candidate.json'
      - 'css/glaze-v1.1*.css'
      - 'reference/v1.1/**'
      - 'scripts/validate_glaze_v1_1_candidate.py'
      - 'scripts/validate_glaze_v1_1_implementation.py'
      - 'scripts/validate_glaze_v1_1_rendered.py'
      - 'acceptance/v1.1-specification-candidate.md'
      - 'acceptance/v1.1-rendered-web-evidence.json'
      - '.github/workflows/glaze-v1.1-candidate.yml'
      - 'contracts/performance/glaze-v1-performance-budget.json'
      - 'contracts/accessibility/resolution-matrix.json'
      - 'tokens/materials.json'
      - 'tokens/semantic-colors.json'
      - 'tokens/layout.json'
      - 'css/glaze-v1.0.0.css'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preserve current V1 baseline
        run: python3 scripts/validate_glaze_v1.py

      - name: Validate current material contract
        run: python3 scripts/validate_materials.py

      - name: Validate current semantic color contract
        run: python3 scripts/validate_semantic_colors.py

      - name: Validate current layout contract
        run: python3 scripts/validate_layout.py

      - name: Validate V1.1 specification-stable candidate
        run: python3 scripts/validate_glaze_v1_1_candidate.py

      - name: Validate isolated V1.1 implementation candidate
        run: python3 scripts/validate_glaze_v1_1_implementation.py

      - name: Validate rendered V1.1 web candidate
        run: python3 scripts/validate_glaze_v1_1_rendered.py

      - name: Upload V1.1 rendered review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.1-candidate-rendered
          path: artifacts/glaze-v1.1-*.png
          if-no-files-found: warn

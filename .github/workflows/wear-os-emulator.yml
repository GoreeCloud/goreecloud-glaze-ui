name: Glaze UI Wear OS Emulator Runtime — Deferred Manual Validation

# Wear OS is intentionally deferred to a later Glaze UI upgrade. This workflow
# is preserved as a manual development/reference check and is not a Glaze UI
# 1.5 merge, Candidate-promotion, Stable-promotion, or production-conformance gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wear-os-emulator-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out requested source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Android SDK and stable Wear OS image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          WEAR_IMAGE="$($SDKMANAGER --list --verbose | grep -E '^system-images;android-[0-9]+(-ext[0-9]+)?;android-wear;x86_64$' | sort -V | tail -n 1)"
          test -n "$WEAR_IMAGE"
          echo "Using Wear OS system image: $WEAR_IMAGE"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "WEAR_IMAGE=$WEAR_IMAGE" >> "$GITHUB_ENV"

      - name: Install Wear OS emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "$WEAR_IMAGE"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/emulator/emulator"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install verified Gradle 9.5.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://services.gradle.org/distributions/gradle-9.5.0-bin.zip \
            --output /tmp/gradle-9.5.0-bin.zip
          echo "553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746  /tmp/gradle-9.5.0-bin.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle-9.5.0-bin.zip -d /tmp
          echo "/tmp/gradle-9.5.0/bin" >> "$GITHUB_PATH"

      - name: Build deferred Wear OS reference APK
        working-directory: reference/native/wear-os/buildable
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Create deterministic Wear OS emulator
        shell: bash
        run: |
          set -euo pipefail
          AVD_NAME=glaze-wear-runtime
          AVD_ROOT="$HOME/.android/avd"
          AVD_DIR="$AVD_ROOT/$AVD_NAME.avd"
          IMAGE_RELATIVE="${WEAR_IMAGE//;/\/}/"
          IMAGE_DIR="$SDK_ROOT/$IMAGE_RELATIVE"
          test -f "$IMAGE_DIR/system.img"
          test -f "$IMAGE_DIR/kernel-ranchu"
          mkdir -p "$AVD_DIR"
          cat > "$AVD_ROOT/$AVD_NAME.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/$AVD_NAME.avd
          target=android-35
          EOF
          cat > "$AVD_DIR/config.ini" <<EOF
          AvdId=$AVD_NAME
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=Glaze UI Wear OS Runtime
          avd.ini.encoding=UTF-8
          disk.dataPartition.size=2G
          fastboot.forceColdBoot=yes
          fastboot.forceFastBoot=no
          hw.accelerometer=yes
          hw.audioInput=no
          hw.battery=yes
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.device.manufacturer=Google
          hw.device.name=wearos_small_round
          hw.gps=yes
          hw.keyboard=yes
          hw.lcd.circular=true
          hw.lcd.density=320
          hw.lcd.height=450
          hw.lcd.width=450
          hw.mainKeys=no
          hw.ramSize=1536
          hw.sdCard=no
          hw.sensors.orientation=yes
          hw.sensors.proximity=no
          hw.trackBall=no
          image.sysdir.1=$IMAGE_RELATIVE
          runtime.network.latency=none
          runtime.network.speed=full
          skin.dynamic=yes
          tag.display=Wear OS
          tag.id=android-wear
          vm.heapSize=256
          EOF
          grep -F 'hw.device.name=wearos_small_round' "$AVD_DIR/config.ini"
          grep -F 'tag.id=android-wear' "$AVD_DIR/config.ini"
          "$SDK_ROOT/emulator/emulator" -list-avds | grep -Fx "$AVD_NAME"
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Boot, install, launch, and inspect deferred Wear OS reference
        shell: bash
        env:
          APK_PATH: reference/native/wear-os/buildable/app/build/outputs/apk/debug/app-debug.apk
          PACKAGE_NAME: com.goreecloud.glazeui.reference.wearable
          ACTIVITY_NAME: com.goreecloud.glazeui.reference.wearable.MainActivity
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          EMULATOR_LOG="$RUNNER_TEMP/wear-os-emulator.log"
          SCREENSHOT="$RUNNER_TEMP/wear-os-runtime.png"
          nohup "$SDK_ROOT/emulator/emulator" \
            -avd glaze-wear-runtime \
            -no-window \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            >"$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          adb wait-for-device
          BOOTED=0
          for _ in $(seq 1 150); do
            if test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          test "$BOOTED" = "1"

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r "$APK_PATH"
          adb shell pm path "$PACKAGE_NAME" | grep -F 'package:'
          adb shell am start -W -n "$PACKAGE_NAME/$ACTIVITY_NAME" | tee "$RUNNER_TEMP/wear-os-launch.txt"
          grep -F 'Status: ok' "$RUNNER_TEMP/wear-os-launch.txt"
          sleep 3
          adb exec-out screencap -p > "$SCREENSHOT"
          test -s "$SCREENSHOT"
          file "$SCREENSHOT" | grep -F 'PNG image data'
          adb shell am force-stop "$PACKAGE_NAME"

      - name: Preserve emulator diagnostics on failure
        if: failure()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/wear-os-emulator.log" || tail -n 300 "$RUNNER_TEMP/wear-os-emulator.log"
          adb devices -l || true
